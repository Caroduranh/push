button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 40px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand h1{font-variation-settings:"wdth" 120;font-weight:800;font-size:clamp(30px,4.4vw,50px);line-height:1;letter-spacing:-.015em;margin:0}
.sig{font-family:var(--sig);font-size:clamp(24px,2.7vw,32px);line-height:1;margin:2px 0 0 4px;display:block;transform:rotate(-3deg);transform-origin:left}
.sub{margin:12px 0 0;color:var(--muted);max-width:56ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.trace-rule{display:block;width:100%;height:18px;margin:18px 0 20px;color:var(--line)}

.toprow{display:flex;flex-wrap:wrap;gap:0 12px}
.tabs{display:inline-flex;gap:0;border:1px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:22px}
.tabs button{border:0;background:transparent;padding:10px 18px;font-weight:700;cursor:pointer;font-variation-settings:"wdth" 110}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,1fr);gap:32px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

/* the Push drawing */
.push{position:relative;background:var(--dev);color:var(--dev-line);border:1.5px solid var(--dev-line);border-radius:18px;padding:clamp(18px,3.4vw,34px);display:flex;flex-direction:column;gap:clamp(10px,1.8vw,16px);outline:1px solid var(--line);outline-offset:4px}
.push::before{content:"";position:absolute;inset:clamp(7px,1.3vw,12px);border:1px solid #2e2e2e;border-radius:12px;pointer-events:none}
.via{position:absolute;width:7px;height:7px;border-radius:50%;border:1.2px solid var(--dev-dim);background:var(--dev)}
.via.tl{top:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px)}.via.tr{top:clamp(4px,1vw,9px);right:clamp(4px,1vw,9px)}
.via.bl{bottom:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px)}.via.br{bottom:clamp(4px,1vw,9px);right:clamp(4px,1vw,9px)}
.screen{position:relative;border-bottom:1px solid #333;min-height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px;font-family:var(--mono);font-size:clamp(11px,1.3vw,13px);letter-spacing:.04em;color:var(--dev-line)}
.screen .hl{color:var(--yellow)}
.silk{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dev-dim);text-transform:uppercase;padding:0 2px}
.gridwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,.9vw,8px)}
.pad{position:relative;aspect-ratio:1;border:1px solid var(--pad-edge);border-radius:clamp(3px,.6vw,6px);background:var(--pad-off);color:var(--pad-ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background-color .12s,transform .08s}
.pad:active{transform:scale(.95)}
.pad.scale{background:var(--pad-scale);color:#cfcfcb;border-color:#444}
.pad.tonic::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--tonic);border-radius:inherit;opacity:.8;pointer-events:none}
.pad .nm{position:absolute;left:4px;bottom:2px;font-family:var(--mono);font-size:clamp(8px,1vw,10px);opacity:.85}
.pad .tag{position:absolute;right:4px;top:2px;font-family:var(--mono);font-size:clamp(7px,.95vw,10px);font-weight:500;opacity:.8}
.pad .fn{font-variation-settings:"wdth" 112;font-weight:800;font-size:clamp(12px,2vw,20px)}
.pad.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pad.on.fR{background:var(--bR);border-color:var(--bR);color:#fff}.pad.on.fT{background:var(--bT);border-color:var(--bT);color:#fff}.pad.on.fF{background:var(--bF);border-color:var(--bF);color:#0b1a52}
.pad.sc.p1,.pad.sc.p2,.pad.sc.p3{background:var(--blue);border-color:var(--blue);color:#fff}
.pad.sc.tj{background:var(--yellow);border-color:var(--yellow);color:#1d1600}
.pad.dim{opacity:.22}
.notes.dim{opacity:.3}
.focus{display:flex;gap:6px;flex-wrap:wrap}
.focus .chip{padding:8px 14px}
.finger{position:absolute;left:0;top:0;border-radius:50%;background:rgba(255,255,255,.42);border:2px solid rgba(255,255,255,.9);color:#0d0d0d;display:flex;align-items:center;justify-content:center;font-weight:800;font-variation-settings:"wdth" 112;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:left .09s ease-out,top .09s ease-out,opacity .15s,transform .15s;z-index:3}
.pad.fu .fn{opacity:0}
.handsvg{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.hand{background:none;border:0;padding:0;cursor:pointer;opacity:.35;transition:opacity .15s;color:var(--ink);text-align:center}
.hand[aria-pressed="true"]{opacity:1}
.hand svg{width:118px;height:auto;display:block}
.hand .sh{fill:none;stroke:currentColor;stroke-width:1.4}
.hand .th{fill:none;stroke:currentColor;stroke-width:1.2;stroke-dasharray:3 3;opacity:.55}
.hand .fg{fill:transparent;stroke:currentColor;stroke-width:1.4;transition:fill .08s}
.hand .fg.on{fill:var(--blue);stroke:var(--blue)}
.hand text{fill:currentColor;font-family:var(--mono);font-size:13px;font-weight:500;text-anchor:middle}
.hand text.on{fill:#fff}
.hand text.tx{font-size:9px;opacity:.6}
.hand span{display:block;font-family:var(--mono);font-size:11px;margin-top:4px;letter-spacing:.06em}
.finger.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.finger small{position:absolute;bottom:-18px;font-family:var(--mono);font-size:10px;font-weight:500;color:#f2f2ef;letter-spacing:.06em}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.notes span{font-family:var(--mono);font-size:13px;padding:4px 8px;border-radius:6px;color:#fff}
.notes .p1,.notes .p2,.notes .p3{background:var(--blue);color:#fff}.notes .tj{background:var(--yellow);color:#1d1600}
.notes .now{outline:2px solid var(--ink);outline-offset:1px}
.patline{font-family:var(--mono);font-size:13px;color:var(--muted);margin:10px 0 4px}
.pad.next{background:var(--yellow);border-color:var(--yellow);color:#1d1600}
.pad.common{box-shadow:inset 0 0 0 3px var(--yellow)}
.pad.bass::before{content:"";position:absolute;left:20%;right:20%;bottom:13%;height:3px;border-radius:2px;background:currentColor}
.pad.bass .nm{bottom:auto;top:2px}
.hidenames .pad:not(.on):not(.next) .nm{display:none}
svg.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.traces path{fill:none;stroke:var(--yellow);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.traces circle{fill:var(--dev);stroke:var(--yellow);stroke-width:2}
svg.traces circle.end{fill:var(--yellow)}
svg.outl path{stroke:#f2f2ef;stroke-width:1.6;fill:none}
svg.outl path.s2{stroke-dasharray:7 5}
svg.outl path.s3{stroke-dasharray:0.1 5;stroke-width:2.6;stroke-linecap:round}
svg.outl rect{fill:var(--dev)}
svg.outl text{fill:#f2f2ef;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.flow svg.traces path{stroke-dasharray:7 9;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}

.topctl{margin-bottom:14px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:8px}
.metro,.midibar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.topctl .btn{padding:7px 12px}
.sndbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sndsel{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pushctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.mst{font-size:13px;color:var(--muted)}.mst.ok{color:#1fae6b;font-weight:600}.mst.warn{color:#e5484d}
.midibar [hidden]{display:none!important}
.pmenu{position:relative}
.pmenu summary{list-style:none;cursor:pointer;width:34px;height:34px;border-radius:8px;box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center;font-size:16px}
.pmenu summary::-webkit-details-marker{display:none}
.pmenu-body{position:absolute;right:0;top:40px;z-index:30;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;min-width:240px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:14px}
.pmenu-body p{margin:0;font-size:12px;color:var(--muted)}
.hdr-r{display:flex;gap:10px;align-items:center}
.kbctl{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-left:auto}.kbctl[hidden]{display:none}.kbhint{font-size:12px;color:var(--muted)}

function pcName(pc){const k=K(),s=S();for(let i=0;i<7;i++)if((k.root+s[i])%12===pc)return k.sp[i];return (k.flat?FLAT:SHARP)[pc];}
function inScale(p){return MAJ.includes(((p%12)+12)%12);}
const ROWS=()=>state.dev==="move"?4:8;

function padPitch(r,c){return 48+r*5+c;}
const onGridP=p=>{for(let r=0;r<ROWS();r++){const c=p-48-5*r;if(c>=0&&c<8)return true;}return false;};
function chordInfo(deg){
  const k=K(),s=S();
  const r=s[deg],th=s[(deg+2)%7]+(deg+2>=7?12:0),fi=s[(deg+4)%7]+(deg+4>=7?12:0);
  const q=(th-r)===4?"maj":((fi-r)===6?"dim":"min");
  let rn=ROM[deg];if(q!=="maj")rn=rn.toLowerCase();if(q==="dim")rn+="°";
  const base=48+k.root;
  return {q,rn,name:k.sp[deg]+(q==="maj"?"":q==="min"?"m":"°"),
    notes:[{p:base+r,f:"R"},{p:base+th,f:"T"},{p:base+fi,f:"F"}]};
}
function voiced(deg,inv){
  const n=chordInfo(deg).notes.map(x=>({...x}));
  if(inv>=1)n[0].p+=12;if(inv>=2)n[1].p+=12;
  return n.sort((a,b)=>a.p-b.p);
}

const PAT=[

 [[0,0],[0,2],[1,-1],[1,0],[1,2],[2,-1],[2,1],[2,2]],

    if(padPitch(r,c)%12!==k.root)continue;

      let cur=[r,c],pat=st,segs=[];
      while(pat<3){

        if(pat===2&&k.mode==="maj"){const alt=P3_MAJ_ROW.map(o=>[cur[0]+o[0],cur[1]+o[1]]);if(alt.every(x=>onGrid(x[0],x[1])))tpl=P3_MAJ_ROW;}

function pChord(deg){const k=K(),s=S(),min=k.mode==="min";
  const pcs=[0,2,4].map(i=>(k.root+s[(deg+i)%7])%12),nm=[0,2,4].map(i=>k.sp[(deg+i)%7]);
  if(min&&deg===4){pcs[1]=(pcs[1]+1)%12;nm[1]=raiseN(nm[1]);}
  const minor=(pcs[1]-pcs[0]+12)%12===3,rom=minor?ROM[deg].toLowerCase():ROM[deg];
  return {pcs,nm,name:nm[0]+(minor?"m":""),rom};}
const nmOf=(ch,pc)=>{const i=ch.pcs.indexOf(pc);return i>=0?ch.nm[i]:pcName(pc);};
const progLabel=i=>PPROG[i].map(d=>pChord(d).rom).join("–");

const MAR=()=>state.gmode==="scale"?(state.pmar==="maj"?MAJ_ORDER:state.pmar==="min"?MIN_ORDER:null):null;
const keyFull=k=>{const L=t();return k.endsWith("m")?k.slice(0,-1)+" "+L.minS:k+" "+L.majS;};
function pBestKey(){if(MAR())return `pm-${state.dev}-${state.pmar}-${pOct()}-${state.sdown?1:0}`;return state.gmode==="scale"?`ps-${state.dev}-${state.key}-${pOct()}-${state.sdown?1:0}`:`pp-${state.dev}-${state.key}-${state.pprog}-${state.pdur}-${state.pvl?1:0}`;}
function heldColl(){const m=new Map();if(!P.on||state.gmode!=="prog")return m;const ch=pChord(PPROG[state.pprog][P.ci]);
  held.forEach(k=>{const [r,c]=k.split(",").map(Number),p=padPitch(r,c);if(ch.pcs.includes(p%12))m.set(p%12,{p,r,c});});return m;}

  const tt=pTimeTxt();["gtime","gscreentime"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=tt;});}
function pFinish(ok,title,msg){if(MAR()){state.key=MAR()[0];state.over={};}clearInterval(P.timer);P.timer=null;P.on=false;G.running=false;P.elapsed=P.t0?Date.now()-P.t0:0;
  P.okHold=new Set();P.res=ok?"ok":"bad";P.failAt=Date.now();P.title=title||"";P.msg=msg||"";P.flash=[];const a=ac();

function pFlash(r,c){if(held.has(r+","+c))P.okHold.add(r*8+c);const f=[r*8+c];P.flash=f;render();setTimeout(()=>{if(P.flash===f){P.flash=[];render();}},160);}
function moveCost(a,b){let s=0;for(let i=0;i<3;i++)s+=Math.abs(a[i]-b[i]);return s;}
function bestVoicing(prev,pcs){let best=null;
  for(let i=0;i<3;i++)for(let p0=minP();p0<=maxP();p0++){if(p0%12!==pcs[i])continue;
    let p1=p0+1;while(p1%12!==pcs[(i+1)%3])p1++;let p2=p1+1;while(p2%12!==pcs[(i+2)%3])p2++;
    if(p2>maxP())continue;const v=[p0,p1,p2],c=moveCost(prev,v);if(!best||c<best.cost)best={v,cost:c};}
  return best;}
function practiceNote(p,r,c){
  const L=t(),k=K();
  if(!P.on){if(((p-k.root)%12+12)%12!==0||Date.now()-(P.failAt||0)<700)return;startPractice();if(!P.on)return;}
  if(state.gmode==="scale"){
    if(P.idx===0){
      if(((p-k.root)%12+12)%12!==0)return pFinish(false,L.pFail,`${L.pYou} ${pcName(p%12)}. ${fill(L.pNotTonic,{X:k.sp[0]})}`);
      if(p+12*pOct()>maxP())return pFinish(false,L.pFail,fill(L.pTooHigh,{N:pOct()===1?L.pOct1:L.pOct2}));
      const s=S(),up=[];for(let i=0;i<=7*pOct();i++)up.push(p+s[i%7]+12*Math.floor(i/7));
      P.seq=state.sdown?up.concat(up.slice(0,-1).reverse()):up;P.idx=1;if(!MAR()||P.mi===0)P.t0=Date.now();pFlash(r,c);return;}
    const exp=P.seq[P.idx];
    if(p===exp){P.idx++;
      if(P.idx>=P.seq.length){
        if(MAR()&&P.mi<MAR().length-1){P.mi++;state.key=MAR()[P.mi];state.over={};P.seq=[];P.idx=0;const a=ac();if(a)[0,7].forEach((n,i)=>tone(84+n,a.currentTime+0.03+i*0.08,0.18));pFlash(r,c);return;}
        pFinish(true,MAR()?L.pDoneMar:L.pDoneScale);}
      else pFlash(r,c);return;}
    return pFinish(false,L.pFail,p%12===exp%12?`${L.pYou} ${pcName(p%12)}: ${L.pOctave}.`:`${L.pYou} ${pcName(p%12)}, ${L.pWas} ${pcName(exp%12)}.`);
  }
  const ch=pChord(PPROG[state.pprog][P.ci]),pc=p%12;
  if(!ch.pcs.includes(pc))return pFinish(false,L.pFail,fill(L.pNotInChord,{X:pcName(pc),C:ch.name,N:ch.nm.join(" · ")}));
  P.coll.set(pc,{p,r,c});if(held.has(r+","+c))P.okHold.add(r*8+c);
  if(P.coll.size<3){render();return;}
  const v=[...P.coll.values()].map(x=>x.p).sort((a,b)=>a-b);
  if(state.pvl&&P.prev){const b=bestVoicing(P.prev,ch.pcs);
    if(b&&moveCost(P.prev,v)>b.cost)return pFinish(false,L.pFailVL,fill(L.pVLmsg,{C:ch.name,N:b.v.map(x=>nmOf(ch,x%12)).join(" · ")}));}
  P.prev=v;P.chords++;const f=[...P.coll.values()].map(x=>x.r*8+x.c);P.flash=f;
  setTimeout(()=>{if(P.flash===f){P.flash=[];render();}},300);
  P.ci=(P.ci+1)%4;if(P.ci===0)P.loops++;P.coll=heldColl();
  P.okHold=new Set([...P.coll.values()].filter(x=>held.has(x.r+","+x.c)).map(x=>x.r*8+x.c));render();
}

/* luces del fondo: de vez en cuando una estrella fugaz o una luz que se enciende en los bordes (nunca en el centro) */
(function(){const cv=document.getElementById("sky"),cx=cv.getContext("2d");let W=0,H=0,dpr=1,fx=[],raf=0;

  const size=()=>{dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);};
  size();addEventListener("resize",size);
  const edge=(x,y)=>{const dx=(x/W-.5)/.62,dy=(y/H-.46)/.58,d=Math.sqrt(dx*dx+dy*dy);return Math.max(0,Math.min(1,(d-.55)/.45));}; // 0 en el centro, 1 en los bordes
  function spawn(){

    if(Math.random()<.55){const fromLeft=Math.random()<.5,y=Math.random()*H*.45,ang=(fromLeft?1:-1)*(.25+Math.random()*.3);
      fx.push({t:"star",x:fromLeft?Math.random()*W*.3:W-Math.random()*W*.3,y,vx:(fromLeft?1:-1)*Math.cos(Math.abs(ang))*780,vy:Math.sin(Math.abs(ang))*780,life:0,max:1.1});}
    else{let x,y,tries=0;do{x=Math.random()*W;y=Math.random()*H;tries++;}while(edge(x,y)<.7&&tries<40);
      const col=Math.random()<.5?"255,200,61":(Math.random()<.5?"150,110,255":"90,180,255");
      fx.push({t:"glow",x,y,r:22+Math.random()*30,col,life:0,max:2.6});}
    if(!raf)raf=requestAnimationFrame(tick);schedule();}
  function schedule(){setTimeout(spawn,4000+Math.random()*7000);}
  let last=0;
  function tick(ts){const dt=last?Math.min(.05,(ts-last)/1000):.016;last=ts;cx.clearRect(0,0,W,H);
    fx=fx.filter(f=>(f.life+=dt)<f.max);
    for(const f of fx){const p=f.life/f.max,fade=Math.sin(Math.PI*p);
      if(f.t==="star"){f.x+=f.vx*dt;f.y+=f.vy*dt;const a=.55*fade*edge(f.x,f.y);if(a<.01)continue;

  else if(d.view){if(lockedView(d.view)){openAcct("paywall");return;}if(state.playing)stopPlay();if(scPlaying)stopScale();if(G.running)endGame(false);G.over=false;state.view=d.view;if(lockedKey(state.key)){state.key=freeKeyFor(state.key);state.over={};}render();}
  else if(d.poct){if(!G.running){state.poct=+d.poct;P.res=null;render();}}
  else if(d.pmar){if(!G.running){if(d.pmar!=="one"&&!PRO){openAcct("paywall");return;}state.pmar=d.pmar;P.res=null;if(MAR()){state.key=MAR()[0];state.over={};}render();}}
  else if(d.pdir!==undefined){if(!G.running){state.sdown=d.pdir==="1";P.res=null;render();}}
  else if(d.pprog!==undefined){if(!G.running){state.pprog=+d.pprog;P.res=null;render();}}
  else if(d.pdur){if(!G.running){state.pdur=+d.pdur;P.res=null;render();}}
  else if(d.pvl!==undefined){if(!G.running){state.pvl=!state.pvl;P.res=null;render();}}
  else if(d.gmode){if(!G.running){state.gmode=d.gmode;P.res=null;if(d.gmode==="prog"&&!PK_ALL.includes(state.key)){state.key=K().mode==="maj"?"C":"Am";state.over={};}G.over=false;G.score=0;G.bestStreak=0;render();}}
  else if(d.glevel){if(!G.running){state.glevel=+d.glevel;G.over=false;G.score=0;G.bestStreak=0;render();}}
  else if(d.gnote!==undefined){gameAnswer(+d.gnote);}
  else if(b.id==="gstart"){G.running?endGame(false):startGame();}
  else if(d.key){keyOpen=false;if(lockedKey(d.key)){render();openAcct("paywall");return;}if(scPlaying){scTimers.forEach(clearTimeout);scTimers=[];scPlaying=false;scaleNow=-1;killSound();}state.key=d.key;state.over={};P.res=null;render();}
  else if(d.deg!==undefined){state.deg=+d.deg;render();playPads(chordPads(state.deg,state.inv));}
  else if(d.inv!==undefined){state.inv=+d.inv;render();playPads(chordPads(state.deg,state.inv));}
  else if(d.preset!==undefined){state.prog=PRESETS[K().mode][+d.preset].slice();state.over={};state.step=0;render();}
  else if(d.add!==undefined){if(state.prog.length<8){state.prog.push(+d.add);state.step=state.prog.length-1;render();playPads(voicings()[state.step].pads);}}
  else if(d.card!==undefined){const i=+d.card;const V=voicings();
    if(i===state.step){state.over[i]=(V[i].inv+1)%3;}else state.step=i;
    render();if(!state.playing)playPads(voicings()[state.step].pads);}
  else if(d.p){const a=ac();if(a)tone(+d.p,a.currentTime+0.01,0.8);}
  else if(b.id==="play")playPads(chordPads(state.deg,state.inv));
  else if(b.id==="playAll")playAll();
  else if(b.id==="undo"){if(state.prog.length){delete state.over[state.prog.length-1];state.prog.pop();render();}}
  else if(b.id==="clear"){if(state.playing)stopPlay();state.prog=[];state.over={};state.step=0;render();}
  else if(b.id==="pplay"){state.playing?stopPlay():startPlay();}
  else if(b.id==="splay")playScale();
  else if(b.id==="mplay"){metOn?stopMet():startMet();}
  else if(b.id==="midiBtn"){(midiState==="on"||midiState==="none")?midiDisconnect():midiConnect();}
  else if(d.bpmstep){setBpm(state.bpm+(+d.bpmstep));}
  else if(d.hand){state.hand=d.hand;render();}
  else if(d.focus!==undefined){const f=+d.focus;if(scPlaying&&state.focus===f){stopScale();}else{state.focus=f;playScale(true);}}
});
document.getElementById("sdown").addEventListener("change",e=>{state.sdown=e.target.checked;render();});
document.getElementById("names").addEventListener("change",e=>{state.names=e.target.checked;render();});
document.getElementById("vl").addEventListener("change",e=>{state.vl=e.target.checked;state.over={};render();});
document.getElementById("helpBtn").addEventListener("click",()=>startTour());
document.getElementById("intro").addEventListener("click",e=>{if(e.target.id==="introOk"){introOpen=false;lsSet("push-lab-intro",true);render();}});
document.addEventListener("click",e=>{const m=document.getElementById("midiOpts");if(m.open&&!m.contains(e.target))m.open=false;});
document.getElementById("sound").addEventListener("change",e=>{state.sound=e.target.value;save();const a=ac();if(a){const t0=a.currentTime+0.02;[60,64,67].forEach((n,i)=>tone(n,t0+i*0.12,0.9));}e.target.blur();});
document.getElementById("midiSnd").addEventListener("change",e=>{midiSnd=e.target.checked;lsSet("push-lab-snd",midiSnd);});
document.getElementById("midiLed").addEventListener("change",e=>{midiLed=e.target.checked;lsSet("push-lab-led",midiLed);ledSync();});
window.addEventListener("pagehide",()=>{if(midiOut)ledsOff();lpLeave();});
document.getElementById("loop").addEventListener("change",e=>{state.loop=e.target.checked;render();});
function setBpm(v){v=Math.min(220,Math.max(40,Math.round(+v)||120));state.bpm=v;document.getElementById("gbpm").value=v;hudUI();if(state.playing){clearInterval(timer);timer=setInterval(tick,60000/state.bpm);}save();}
document.getElementById("gbpm").addEventListener("change",e=>setBpm(e.target.value));
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="select")return;
  if(e.key.toLowerCase()==="m"&&e.key.length===1){metOn?stopMet():startMet();return;}
  if(state.view==="game"){if(e.key===" "){if(tag==="button")return;e.preventDefault();G.running?endGame(false):startGame();return;}
    if(state.gmode==="name"&&/^[a-g]$/i.test(e.key)){const base={c:0,d:2,e:4,f:5,g:7,a:9,b:11}[e.key.toLowerCase()];gameAnswer((base+(e.shiftKey?1:0))%12);}return;}
  if(state.view==="scales"){if(e.key===" "&&tag!=="button"){e.preventDefault();playScale();}return;}
  if(state.view==="prog"){
    const n=state.prog.length;
    if(e.key==="ArrowRight"&&n){state.step=(state.step+1)%n;render();if(!state.playing)playPads(voicings()[state.step].pads);}
    else if(e.key==="ArrowLeft"&&n){state.step=(state.step-1+n)%n;render();if(!state.playing)playPads(voicings()[state.step].pads);}
    else if(e.key===" "&&tag!=="button"){e.preventDefault();state.playing?stopPlay():startPlay();}
    return;
  }
  if(/^[1-7]$/.test(e.key)){state.deg=+e.key-1;render();playPads(chordPads(state.deg,state.inv));}
  else if(e.key.length===1&&"qwe".includes(e.key.toLowerCase())){state.inv="qwe".indexOf(e.key.toLowerCase());render();playPads(chordPads(state.deg,state.inv));}
  else if(e.key===" "&&tag!=="button"){e.preventDefault();playPads(chordPads(state.deg,state.inv));}
});
window.addEventListener("resize",()=>requestAnimationFrame(drawTraces));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(drawTraces));
render();
if(introOpen&&!new URLSearchParams(location.search).get("checkout"))setTimeout(startTour,700);
try{if(localStorage.getItem("push-lab-midi")==="1")midiConnect();}catch(e){}
</script>
