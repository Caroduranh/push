<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push Lab · by Caro Durán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --page:#2e2e2d;--ink:#ededeb;--muted:#a8a8a4;--line:#4d4d4b;--chip:#383837;--sel:#ededeb;--sel-ink:#232322;
  --dev:#0b0b0b;--dev-line:#d6d6d2;--dev-dim:#6b6b68;--pad-off:#151515;--pad-edge:#262626;--pad-scale:#3a3a3a;--pad-ink:#8a8a86;--tonic:#ffc83d;
  --blue:#2f5bff;--yellow:#ffc83d;--bR:#1f45ff;--bT:#5b82ff;--bF:#a9c1ff;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sig:"Mrs Saint Delafield","Snell Roundhand","Brush Script MT",cursive;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 40px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand h1{font-variation-settings:"wdth" 120;font-weight:800;font-size:clamp(30px,4.4vw,50px);line-height:1;letter-spacing:-.015em;margin:0}
.sig{font-family:var(--sig);font-size:clamp(30px,3.6vw,42px);line-height:1;margin:2px 0 0 4px;display:block;transform:rotate(-3deg);transform-origin:left}
.sub{margin:12px 0 0;color:var(--muted);max-width:56ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.trace-rule{display:block;width:100%;height:18px;margin:18px 0 20px;color:var(--line)}

.toprow{display:flex;flex-wrap:wrap;gap:0 12px}
.tabs{display:inline-flex;gap:0;border:1px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:22px}
.tabs button{border:0;background:transparent;padding:10px 18px;font-weight:700;cursor:pointer;font-variation-settings:"wdth" 110}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,1fr);gap:32px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

/* the Push drawing */
.push{position:relative;background:var(--dev);color:var(--dev-line);border:1.5px solid var(--dev-line);border-radius:18px;padding:clamp(18px,3.4vw,34px);display:flex;flex-direction:column;gap:clamp(10px,1.8vw,16px);outline:1px solid var(--line);outline-offset:4px}
.push::before{content:"";position:absolute;inset:clamp(7px,1.3vw,12px);border:1px solid #2e2e2e;border-radius:12px;pointer-events:none}
.via{position:absolute;width:7px;height:7px;border-radius:50%;border:1.2px solid var(--dev-dim);background:var(--dev)}
.via.tl{top:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px)}.via.tr{top:clamp(4px,1vw,9px);right:clamp(4px,1vw,9px)}
.via.bl{bottom:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px)}.via.br{bottom:clamp(4px,1vw,9px);right:clamp(4px,1vw,9px)}
.screen{position:relative;border-bottom:1px solid #333;min-height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px;font-family:var(--mono);font-size:clamp(11px,1.3vw,13px);letter-spacing:.04em;color:var(--dev-line)}
.screen .hl{color:var(--yellow)}
.silk{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dev-dim);text-transform:uppercase;padding:0 2px}
.gridwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,.9vw,8px)}
.pad{position:relative;aspect-ratio:1;border:1px solid var(--pad-edge);border-radius:clamp(3px,.6vw,6px);background:var(--pad-off);color:var(--pad-ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background-color .12s,transform .08s}
.pad:active{transform:scale(.95)}
.pad.scale{background:var(--pad-scale);color:#cfcfcb;border-color:#444}
.pad.tonic::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--tonic);border-radius:inherit;opacity:.8;pointer-events:none}
.pad .nm{position:absolute;left:4px;bottom:2px;font-family:var(--mono);font-size:clamp(8px,1vw,10px);opacity:.85}
.pad .tag{position:absolute;right:4px;top:2px;font-family:var(--mono);font-size:clamp(7px,.95vw,10px);font-weight:500;opacity:.8}
.pad .fn{font-variation-settings:"wdth" 112;font-weight:800;font-size:clamp(12px,2vw,20px)}
.pad.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pad.on.fR{background:var(--bR);border-color:var(--bR);color:#fff}.pad.on.fT{background:var(--bT);border-color:var(--bT);color:#fff}.pad.on.fF{background:var(--bF);border-color:var(--bF);color:#0b1a52}
.pad.sc.p1,.pad.sc.p2,.pad.sc.p3{background:var(--blue);border-color:var(--blue);color:#fff}
.pad.sc.tj{background:var(--yellow);border-color:var(--yellow);color:#1d1600}
.pad.dim{opacity:.22}
.notes.dim{opacity:.3}
.focus{display:flex;gap:6px;flex-wrap:wrap}
.focus .chip{padding:8px 14px}
.finger{position:absolute;left:0;top:0;border-radius:50%;background:rgba(255,255,255,.42);border:2px solid rgba(255,255,255,.9);color:#0d0d0d;display:flex;align-items:center;justify-content:center;font-weight:800;font-variation-settings:"wdth" 112;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:left .09s ease-out,top .09s ease-out,opacity .15s,transform .15s;z-index:3}
.pad.fu .fn{opacity:0}
.handsvg{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.hand{background:none;border:0;padding:0;cursor:pointer;opacity:.35;transition:opacity .15s;color:var(--ink);text-align:center}
.hand[aria-pressed="true"]{opacity:1}
.hand svg{width:118px;height:auto;display:block}
.hand .sh{fill:none;stroke:currentColor;stroke-width:1.4}
.hand .th{fill:none;stroke:currentColor;stroke-width:1.2;stroke-dasharray:3 3;opacity:.55}
.hand .fg{fill:transparent;stroke:currentColor;stroke-width:1.4;transition:fill .08s}
.hand .fg.on{fill:var(--blue);stroke:var(--blue)}
.hand text{fill:currentColor;font-family:var(--mono);font-size:13px;font-weight:500;text-anchor:middle}
.hand text.on{fill:#fff}
.hand text.tx{font-size:9px;opacity:.6}
.hand span{display:block;font-family:var(--mono);font-size:11px;margin-top:4px;letter-spacing:.06em}
.finger.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.finger small{position:absolute;bottom:-18px;font-family:var(--mono);font-size:10px;font-weight:500;color:#f2f2ef;letter-spacing:.06em}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.notes span{font-family:var(--mono);font-size:13px;padding:4px 8px;border-radius:6px;color:#fff}
.notes .p1,.notes .p2,.notes .p3{background:var(--blue);color:#fff}.notes .tj{background:var(--yellow);color:#1d1600}
.notes .now{outline:2px solid var(--ink);outline-offset:1px}
.patline{font-family:var(--mono);font-size:13px;color:var(--muted);margin:10px 0 4px}
.pad.next{background:var(--yellow);border-color:var(--yellow);color:#1d1600}
.pad.common{box-shadow:inset 0 0 0 3px var(--yellow)}
.pad.bass::before{content:"";position:absolute;left:20%;right:20%;bottom:13%;height:3px;border-radius:2px;background:currentColor}
.pad.bass .nm{bottom:auto;top:2px}
.hidenames .pad:not(.on):not(.next) .nm{display:none}
svg.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.traces path{fill:none;stroke:var(--yellow);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.traces circle{fill:var(--dev);stroke:var(--yellow);stroke-width:2}
svg.traces circle.end{fill:var(--yellow)}
svg.outl path{stroke:#f2f2ef;stroke-width:1.6;fill:none}
svg.outl path.s2{stroke-dasharray:7 5}
svg.outl path.s3{stroke-dasharray:0.1 5;stroke-width:2.6;stroke-linecap:round}
svg.outl rect{fill:var(--dev)}
svg.outl text{fill:#f2f2ef;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.flow svg.traces path{stroke-dasharray:7 9;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}

.topctl{margin-bottom:14px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:8px}
.metro,.midibar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.topctl .btn{padding:7px 12px}
.sndbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sndsel{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pushctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.mst{font-size:13px;color:var(--muted)}.mst.ok{color:#1fae6b;font-weight:600}.mst.warn{color:#e5484d}
.midibar [hidden]{display:none!important}
.pmenu{position:relative}
.pmenu summary{list-style:none;cursor:pointer;width:34px;height:34px;border-radius:8px;box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center;font-size:16px}
.pmenu summary::-webkit-details-marker{display:none}
.pmenu-body{position:absolute;right:0;top:40px;z-index:30;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;min-width:240px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:14px}
.pmenu-body p{margin:0;font-size:12px;color:var(--muted)}
.hdr-r{display:flex;gap:10px;align-items:center}
.helpbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.intro{border:1px solid var(--yellow);border-radius:12px;padding:14px 18px;margin:0 0 18px}
.intro h2{margin:0 0 6px;font-size:18px}.intro ol{margin:6px 0 12px;padding-left:20px}.intro li{margin:4px 0}
.mgroup{display:flex;flex-direction:column;gap:6px;margin-right:10px}
.mgroup small{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mgroup span{display:flex;flex-wrap:wrap;gap:8px}
.restart{color:var(--yellow);font-weight:600}
.metro .btn.on{background:var(--yellow);color:#1d1600;box-shadow:none}
.bpmbox{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bpmbox .num{width:64px;text-align:center}
.step{width:34px;height:36px;border:1px solid var(--line);background:var(--chip);border-radius:8px;cursor:pointer;font-weight:700}
.beats{display:flex;gap:10px;align-items:center;margin-left:auto}
.beats i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);transition:background-color .05s}
.beats i:first-child{width:15px;height:15px}
.beats i.on{background:var(--yellow);border-color:var(--yellow)}
.under{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.under .setup{font-family:var(--mono);font-size:12px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* panel */
.panel h2{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.block{margin-bottom:22px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys .rowlab{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:4px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:8px 4px;cursor:pointer;font-weight:700;text-align:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.degs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media (max-width:420px){.degs{grid-template-columns:repeat(4,1fr)}}
.deg{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px}
.deg .r{font-size:12px;font-weight:600;opacity:.75}
.invs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets .chip{padding:8px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

.readout{border-top:2px solid var(--ink);padding-top:14px;margin-bottom:18px}
.nameline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.cname{font-variation-settings:"wdth" 122;font-weight:800;font-size:clamp(48px,7vw,72px);line-height:.95;letter-spacing:-.02em}
.rn{font-size:26px;font-weight:600;font-family:Georgia,"Times New Roman",serif}
.fig{display:inline-flex;flex-direction:column;font-size:.5em;line-height:1;vertical-align:.55em;margin-left:1px}
.invname{margin:6px 0 12px;color:var(--muted)}
.nextline{margin:4px 0 0;font-size:15px}
.nextline b{color:var(--ink)}
.nextline .dot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--yellow);margin-right:6px;vertical-align:0}
.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-width:320px}
.stack li{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;font-size:15px}
.stack .pos{color:var(--muted);font-size:13px;font-family:var(--mono)}
.stack .note{border-radius:6px;padding:6px 10px;font-weight:700;display:flex;justify-content:space-between;background:var(--blue);color:#fff}
.stack .note small{font-weight:500;opacity:.85}
.stack .note.fR{background:var(--bR)}.stack .note.fT{background:var(--bT)}.stack .note.fF{background:var(--bF);color:#0b1a52}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--sel);color:var(--sel-ink)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.playing{background:var(--yellow);color:#1d1600}
.num{width:72px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px;cursor:pointer;text-align:center}
.mini[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset;border-color:var(--ink)}
.mini .dev{background:var(--dev);border-radius:6px;padding:4px}
.mini .grid{gap:2px}
.mini .pad{border-radius:2px;cursor:inherit;border:0}
.mini .pad::after,.mini .pad::before{display:none}
.mini span.lab{display:block;margin-top:6px;font-size:13px;font-weight:600}

/* progression timeline */
.timeline{margin-top:22px;border-top:1.5px solid var(--ink);padding-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.card{position:relative;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.card::before{content:"";position:absolute;top:-17px;left:50%;width:1.5px;height:16px;background:var(--ink)}
.card::after{content:"";position:absolute;top:-21px;left:calc(50% - 3.5px);width:8px;height:8px;border-radius:50%;background:var(--page);border:1.5px solid var(--ink)}
.card .cn{font-weight:800;font-size:20px;font-variation-settings:"wdth" 115}
.card .cr{font-family:Georgia,"Times New Roman",serif;font-size:15px}
.card .ci{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.card.cur .ci{color:#dfe6ff}
.card.cur::after{background:var(--blue);border-color:var(--blue)}
.card.nx{box-shadow:0 0 0 2px var(--yellow) inset;border-color:var(--yellow)}
.card.nx::after{background:var(--yellow);border-color:var(--yellow)}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;padding:6px 0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

.keysline{font-size:13px;color:var(--muted);margin-top:22px}
kbd{font-family:var(--mono);font-weight:500;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
footer .sig{font-size:30px;color:var(--ink);transform:rotate(-2deg)}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(3px,.6vw,6px);padding-top:4px}
.steps i{display:block;height:clamp(6px,1vw,9px);border-radius:3px;background:#1c1c1c;border:1px solid #2c2c2c}
.steps i:nth-child(4n+1){background:#262626}
.pad.ok{background:#1fae6b;border-color:#1fae6b;color:#fff}
.pad.bad{background:#e5484d;border-color:#e5484d;color:#fff}
.pad.q{background:var(--yellow);border-color:var(--yellow);color:#1d1600;animation:qpulse 1s ease-in-out infinite}
@keyframes qpulse{50%{box-shadow:0 0 0 4px rgba(255,200,61,.35)}}
.pad.bad .fn,.pad.ok .fn{font-size:clamp(10px,1.5vw,16px)}
.gamenames .pad .nm{display:none}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}
.gstats div{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gstats b{display:block;font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 115;font-size:30px;line-height:1.1;color:var(--ink);letter-spacing:0;text-transform:none}
.gstats b.low{color:#e5484d}
.gtarget{font-variation-settings:"wdth" 122;font-weight:800;font-size:clamp(44px,6.5vw,64px);line-height:1;letter-spacing:-.02em}
.gnew{color:var(--yellow);font-weight:800}
.pad.ptonic{background:var(--yellow);border-color:var(--yellow);color:#1d1600}.pad.ptonic::after{display:none}
@media (max-width:480px){.tabs button{padding-left:11px;padding-right:11px;font-size:14px}}
.gtarget.bad{color:#ff6b6b}.gtarget small{font-size:.45em;font-weight:600;margin-left:8px;color:var(--muted)}
.pchords{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pchords span{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-weight:600}
.pchords span.cur{background:var(--ink);color:var(--page);border-color:var(--ink)}
.popt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.nbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:18px}
.nbtns .chip{padding:10px 2px;font-size:15px}
.nbtns .chip.good{background:#1fae6b;border-color:#1fae6b;color:#fff}
.nbtns .chip.wrong{background:#e5484d;border-color:#e5484d;color:#fff}
.nbtns .chip:disabled{opacity:.45;cursor:default}
#keys .chip:disabled,#gamePanel .chip:disabled{opacity:.3;cursor:default}
@media (prefers-reduced-motion: reduce){.pad.q{animation:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.finger{transition:opacity .15s}.pad{transition:none}.pad:active{transform:none}.flow svg.traces path{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 data-t="title"></h1>
      <span class="sig" aria-label="by Caro Durán">by Caro Durán</span>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="hdr-r"><button class="helpbtn" id="helpBtn">?</button><div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="es">ES</button></div></div>

const NSH=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],NFL=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];

function loadBest(){try{return JSON.parse(localStorage.getItem("push-lab-best")||"{}")||{}}catch(e){return {}}}

  const sc=document.getElementById("gscreentime");if(sc)sc.textContent=s+"s";}

function gamePadTap(r,c,silent){
  if(state.gmode==="scale"||state.gmode==="prog"){const p=padPitch(r,c),a=silent?null:ac();if(a)tone(p,a.currentTime+0.01,0.5);practiceNote(p,r,c);return;}

/* práctica: escalas y progresiones sin guía */
const PK={maj:["C","G","D","A","F","B♭"],min:["Am","Em","Bm","F♯m","Dm","Gm"]},PK_ALL=[...PK.maj,...PK.min];
const PPROG=[[0,3,4,3],[0,5,3,4],[0,3,5,4]]; // grados: 0 = I
const P={on:false,res:null,title:"",msg:"",seq:[],idx:0,t0:0,elapsed:0,timer:null,end:0,ci:0,coll:new Map(),prev:null,loops:0,chords:0,flash:[],newBest:false};
const isPrac=()=>state.view==="game"&&(state.gmode==="scale"||state.gmode==="prog");
const keyOff=k=>G.running&&isPrac();const progOnly=()=>state.view==="game"&&state.gmode==="prog";
const pOct=()=>state.dev==="move"?1:(state.poct||2);
const maxP=()=>padPitch(ROWS()-1,7),minP=()=>padPitch(0,0);
const fill=(str,o)=>str.replace(/\{(\w)\}/g,(m,k)=>o[k]!==undefined?o[k]:m);
const raiseN=n=>n.endsWith("♭")?n.slice(0,-1):n+"♯";
function pChord(deg){const k=K(),s=S(),min=k.mode==="min";
  const pcs=[0,2,4].map(i=>(k.root+s[(deg+i)%7])%12),nm=[0,2,4].map(i=>k.sp[(deg+i)%7]);
  if(min&&deg===4){pcs[1]=(pcs[1]+1)%12;nm[1]=raiseN(nm[1]);}
  const minor=(pcs[1]-pcs[0]+12)%12===3,rom=minor?ROM[deg].toLowerCase():ROM[deg];
  return {pcs,nm,name:nm[0]+(minor?"m":""),rom};}
const nmOf=(ch,pc)=>{const i=ch.pcs.indexOf(pc);return i>=0?ch.nm[i]:pcName(pc);};
const progLabel=i=>PPROG[i].map(d=>pChord(d).rom).join("–");
function pBestKey(){return state.gmode==="scale"?`ps-${state.dev}-${state.key}-${pOct()}-${state.sdown?1:0}`:`pp-${state.dev}-${state.key}-${state.pprog}-${state.pdur}-${state.pvl?1:0}`;}
function heldColl(){const m=new Map();if(!P.on||state.gmode!=="prog")return m;const ch=pChord(PPROG[state.pprog][P.ci]);
  held.forEach(k=>{const [r,c]=k.split(",").map(Number),p=padPitch(r,c);if(ch.pcs.includes(p%12))m.set(p%12,{p,r,c});});return m;}
function startPractice(){if(!ac())return;if(scPlaying)stopScale();clearInterval(P.timer);
  Object.assign(P,{on:true,res:null,title:"",msg:"",seq:[],idx:0,t0:0,elapsed:0,ci:0,prev:null,loops:0,chords:0,flash:[],newBest:false});
  G.running=true;G.over=false;
  if(state.gmode==="prog"){P.t0=Date.now();P.end=P.t0+state.pdur*60000;P.coll=heldColl();}
  P.timer=setInterval(pTick,100);render();}
function stopPractice(){clearInterval(P.timer);P.timer=null;P.on=false;G.running=false;P.res=null;render();}
function pTimeTxt(){if(state.gmode==="prog"){const s=P.on?Math.max(0,Math.ceil((P.end-Date.now())/1000)):P.res?0:state.pdur*60;return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
  const ms=P.on?(P.idx>0?Date.now()-P.t0:0):P.elapsed;return (ms/1000).toFixed(1)+"s";}
function pTick(){if(!P.on)return;if(state.gmode==="prog"&&Date.now()>=P.end){pFinish(true,t().pDoneProg);return;}
  const tt=pTimeTxt();["gtime","gscreentime"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=tt;});}
function pFinish(ok,title,msg){clearInterval(P.timer);P.timer=null;P.on=false;G.running=false;P.elapsed=P.t0?Date.now()-P.t0:0;
  P.res=ok?"ok":"bad";P.failAt=Date.now();P.title=title||"";P.msg=msg||"";P.flash=[];const a=ac();
  if(ok){const b=loadBest(),k=pBestKey();
    if(state.gmode==="scale"){if(!b[k]||P.elapsed<b[k]){b[k]=P.elapsed;saveBest(b);P.newBest=true;}}
    else if(P.loops>(b[k]||0)){b[k]=P.loops;saveBest(b);P.newBest=true;}
    if(a)[0,4,7,12].forEach((n,i)=>tone(72+n,a.currentTime+0.05+i*0.09,0.25));}
  render();}
function pFlash(r,c){const f=[r*8+c];P.flash=f;render();setTimeout(()=>{if(P.flash===f){P.flash=[];render();}},160);}
function moveCost(a,b){let s=0;for(let i=0;i<3;i++)s+=Math.abs(a[i]-b[i]);return s;}
function bestVoicing(prev,pcs){let best=null;
  for(let i=0;i<3;i++)for(let p0=minP();p0<=maxP();p0++){if(p0%12!==pcs[i])continue;
    let p1=p0+1;while(p1%12!==pcs[(i+1)%3])p1++;let p2=p1+1;while(p2%12!==pcs[(i+2)%3])p2++;
    if(p2>maxP())continue;const v=[p0,p1,p2],c=moveCost(prev,v);if(!best||c<best.cost)best={v,cost:c};}
  return best;}
function practiceNote(p,r,c){
  const L=t(),k=K();
  if(!P.on){if(((p-k.root)%12+12)%12!==0||Date.now()-(P.failAt||0)<700)return;startPractice();if(!P.on)return;}
  if(state.gmode==="scale"){
    if(P.idx===0){
      if(((p-k.root)%12+12)%12!==0)return pFinish(false,L.pFail,`${L.pYou} ${pcName(p%12)}. ${fill(L.pNotTonic,{X:k.sp[0]})}`);
      if(p+12*pOct()>maxP())return pFinish(false,L.pFail,fill(L.pTooHigh,{N:pOct()===1?L.pOct1:L.pOct2}));
      const s=S(),up=[];for(let i=0;i<=7*pOct();i++)up.push(p+s[i%7]+12*Math.floor(i/7));
      P.seq=state.sdown?up.concat(up.slice(0,-1).reverse()):up;P.idx=1;P.t0=Date.now();pFlash(r,c);return;}
    const exp=P.seq[P.idx];
    if(p===exp){P.idx++;if(P.idx>=P.seq.length)pFinish(true,L.pDoneScale);else pFlash(r,c);return;}
    return pFinish(false,L.pFail,p%12===exp%12?`${L.pYou} ${pcName(p%12)}: ${L.pOctave}.`:`${L.pYou} ${pcName(p%12)}, ${L.pWas} ${pcName(exp%12)}.`);
  }
  const ch=pChord(PPROG[state.pprog][P.ci]),pc=p%12;
  if(!ch.pcs.includes(pc))return pFinish(false,L.pFail,fill(L.pNotInChord,{X:pcName(pc),C:ch.name,N:ch.nm.join(" · ")}));
  P.coll.set(pc,{p,r,c});
  if(P.coll.size<3){render();return;}

  const I=INSTR[state.sound]||INSTR.soft,v=I(a,440*Math.pow(2,(m-69)/12),m,t0,dur,out);
  v.srcs.forEach(o=>{liveNodes.push([o,v.env]);o.onended=()=>{liveNodes=liveNodes.filter(x=>x[0]!==o);};});
  return ()=>{const t=a.currentTime;try{v.env.gain.cancelScheduledValues(t);v.env.gain.setValueAtTime(Math.max(0.0001,v.env.gain.value),t);
    v.env.gain.exponentialRampToValueAtTime(0.0001,t+v.rel);v.srcs.forEach(o=>{try{o.stop(t+v.rel+0.05)}catch(e){}});}catch(e){}};}
function click(t0,acc){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=acc?1760:1180;
  g.gain.setValueAtTime(acc?0.06:0.035,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.04);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+0.05);}
function playPads(pads,dur){const a=ac();if(!a)return;const t0=a.currentTime+0.02;pads.forEach(n=>tone(n.p,t0,dur||0.95));}
let metOn=false,metTimer=null,metNext=0,metBeat=0,beatTimers=[];
function lightBeat(b){document.querySelectorAll("#beats i").forEach((el,i)=>el.classList.toggle("on",i===b));}
function metSchedule(){const a=ac();const spb=60/state.bpm;
  while(metNext<a.currentTime+0.12){const b=metBeat%4;click(metNext,b===0);const d=Math.max(0,(metNext-a.currentTime)*1000);
    beatTimers.push(setTimeout(()=>{if(metOn){lightBeat(b);setTimeout(()=>{if(metOn)lightBeat(-1)},90);}},d));metNext+=spb;metBeat++;}
  if(beatTimers.length>40)beatTimers=beatTimers.slice(-20);}
function updMet(){const b=document.getElementById("mplay");b.textContent=metOn?t().metroStop:t().metro;b.classList.toggle("on",metOn);}
function startMet(){const a=ac();if(!a)return;metOn=true;metNext=a.currentTime+0.06;metBeat=0;metSchedule();metTimer=setInterval(metSchedule,25);updMet();}
function stopMet(){metOn=false;clearInterval(metTimer);beatTimers.forEach(clearTimeout);beatTimers=[];lightBeat(-1);updMet();}
let busy=false;
function playAll(){if(busy)return;busy=true;const btn=document.getElementById("playAll");
  [0,1,2].forEach((i,k)=>setTimeout(()=>{state.inv=i;render();playPads(chordPads(state.deg,i));if(k===2)setTimeout(()=>{busy=false;},1000);},k*1000));}

let timer=null,beat=0;
function startPlay(){if(!state.prog.length)return;if(metOn)stopMet();if(!ac())return;state.playing=true;beat=-4;tick();timer=setInterval(tick,60000/state.bpm);render();}
function stopPlay(){clearInterval(timer);timer=null;state.playing=false;killSound();render();}
function tick(){
  const V=voicings(),a=ac(),t0=a.currentTime+0.01,spb=60/state.bpm;
  if(beat<0){click(t0,beat===-4);lightBeat(beat+4);setTimeout(()=>lightBeat(-1),90);beat++;return;}
  const idx=Math.floor(beat/4),b=beat%4;
  if(idx>=V.length){if(state.loop){beat=0;return tick();}stopPlay();return;}
  click(t0,b===0);lightBeat(b);setTimeout(()=>lightBeat(-1),90);
  if(b===0){state.step=idx;render();V[idx].pads.forEach(n=>tone(n.p,t0,spb*4*0.92));}
  beat++;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.lang){state.lang=d.lang;render();}
  else if(d.dev){if(state.dev!==d.dev){if(state.playing)stopPlay();if(scPlaying)stopScale();if(G.running)endGame(false);G.over=false;G.score=0;G.bestStreak=0;state.dev=d.dev;state.over={};if(d.dev==="push")state.focus=0;held.clear();render();}}
  else if(d.view){if(state.playing)stopPlay();if(scPlaying)stopScale();if(G.running)endGame(false);G.over=false;state.view=d.view;render();}
  else if(d.poct){if(!G.running){state.poct=+d.poct;P.res=null;render();}}
  else if(d.pdir!==undefined){if(!G.running){state.sdown=d.pdir==="1";P.res=null;render();}}
  else if(d.pprog!==undefined){if(!G.running){state.pprog=+d.pprog;P.res=null;render();}}
  else if(d.pdur){if(!G.running){state.pdur=+d.pdur;P.res=null;render();}}
  else if(d.pvl!==undefined){if(!G.running){state.pvl=!state.pvl;P.res=null;render();}}
  else if(d.gmode){if(!G.running){state.gmode=d.gmode;P.res=null;if(d.gmode==="prog"&&!PK_ALL.includes(state.key)){state.key=K().mode==="maj"?"C":"Am";state.over={};}G.over=false;G.score=0;G.bestStreak=0;render();}}
  else if(d.glevel){if(!G.running){state.glevel=+d.glevel;G.over=false;G.score=0;G.bestStreak=0;render();}}
  else if(d.gnote!==undefined){gameAnswer(+d.gnote);}
  else if(b.id==="gstart"){G.running?endGame(false):startGame();}
  else if(state.view==="game"&&d.rc){const [r,c]=d.rc.split(",").map(Number);gamePadTap(r,c);}
  else if(d.key){if(scPlaying){scTimers.forEach(clearTimeout);scTimers=[];scPlaying=false;scaleNow=-1;killSound();}state.key=d.key;state.over={};P.res=null;render();}
  else if(d.deg!==undefined){state.deg=+d.deg;render();playPads(chordPads(state.deg,state.inv));}
  else if(d.inv!==undefined){state.inv=+d.inv;render();playPads(chordPads(state.deg,state.inv));}
  else if(d.preset!==undefined){state.prog=PRESETS[K().mode][+d.preset].slice();state.over={};state.step=0;render();}
  else if(d.add!==undefined){if(state.prog.length<8){state.prog.push(+d.add);state.step=state.prog.length-1;render();playPads(voicings()[state.step].pads);}}
  else if(d.card!==undefined){const i=+d.card;const V=voicings();
    if(i===state.step){state.over[i]=(V[i].inv+1)%3;}else state.step=i;
    render();if(!state.playing)playPads(voicings()[state.step].pads);}
  else if(d.p){const a=ac();if(a)tone(+d.p,a.currentTime+0.01,0.8);}
  else if(b.id==="play")playPads(chordPads(state.deg,state.inv));
  else if(b.id==="playAll")playAll();
  else if(b.id==="undo"){if(state.prog.length){delete state.over[state.prog.length-1];state.prog.pop();render();}}
  else if(b.id==="clear"){if(state.playing)stopPlay();state.prog=[];state.over={};state.step=0;render();}
  else if(b.id==="pplay"){state.playing?stopPlay():startPlay();}
  else if(b.id==="splay")playScale();
  else if(b.id==="mplay"){metOn?stopMet():startMet();}
  else if(b.id==="midiBtn"){(midiState==="on"||midiState==="none")?midiDisconnect():midiConnect();}
  else if(d.bpmstep){setBpm(state.bpm+(+d.bpmstep));}
  else if(d.hand){state.hand=d.hand;render();}
  else if(d.focus!==undefined){const f=+d.focus;if(scPlaying&&state.focus===f){stopScale();}else{state.focus=f;playScale(true);}}
});
document.getElementById("sdown").addEventListener("change",e=>{state.sdown=e.target.checked;render();});
document.getElementById("names").addEventListener("change",e=>{state.names=e.target.checked;render();});
document.getElementById("vl").addEventListener("change",e=>{state.vl=e.target.checked;state.over={};render();});
document.getElementById("helpBtn").addEventListener("click",()=>{introOpen=true;render();document.getElementById("intro").scrollIntoView({behavior:"smooth",block:"start"});});
document.getElementById("intro").addEventListener("click",e=>{if(e.target.id==="introOk"){introOpen=false;lsSet("push-lab-intro",true);render();}});
document.addEventListener("click",e=>{const m=document.getElementById("midiOpts");if(m.open&&!m.contains(e.target))m.open=false;});
document.getElementById("sound").addEventListener("change",e=>{state.sound=e.target.value;save();const a=ac();if(a){const t0=a.currentTime+0.02;[60,64,67].forEach((n,i)=>tone(n,t0+i*0.12,0.9));}e.target.blur();});
document.getElementById("midiSnd").addEventListener("change",e=>{midiSnd=e.target.checked;lsSet("push-lab-snd",midiSnd);});
document.getElementById("midiLed").addEventListener("change",e=>{midiLed=e.target.checked;lsSet("push-lab-led",midiLed);ledSync();});
window.addEventListener("pagehide",()=>{if(midiOut)ledsOff();});
document.getElementById("loop").addEventListener("change",e=>{state.loop=e.target.checked;render();});
function setBpm(v){v=Math.min(220,Math.max(40,Math.round(+v)||120));state.bpm=v;document.getElementById("gbpm").value=v;if(state.playing){clearInterval(timer);timer=setInterval(tick,60000/state.bpm);}save();}
document.getElementById("gbpm").addEventListener("change",e=>setBpm(e.target.value));
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="select")return;
  if(e.key.toLowerCase()==="m"&&e.key.length===1){metOn?stopMet():startMet();return;}
  if(state.view==="game"){if(e.key===" "){if(tag==="button")return;e.preventDefault();G.running?endGame(false):startGame();return;}
    if(state.gmode==="name"&&/^[a-g]$/i.test(e.key)){const base={c:0,d:2,e:4,f:5,g:7,a:9,b:11}[e.key.toLowerCase()];gameAnswer((base+(e.shiftKey?1:0))%12);}return;}
  if(state.view==="scales"){if(e.key===" "&&tag!=="button"){e.preventDefault();playScale();}return;}
  if(state.view==="prog"){
    const n=state.prog.length;
    if(e.key==="ArrowRight"&&n){state.step=(state.step+1)%n;render();if(!state.playing)playPads(voicings()[state.step].pads);}
    else if(e.key==="ArrowLeft"&&n){state.step=(state.step-1+n)%n;render();if(!state.playing)playPads(voicings()[state.step].pads);}
    else if(e.key===" "&&tag!=="button"){e.preventDefault();state.playing?stopPlay():startPlay();}
    return;
  }
  if(/^[1-7]$/.test(e.key)){state.deg=+e.key-1;render();playPads(chordPads(state.deg,state.inv));}
  else if(e.key.length===1&&"qwe".includes(e.key.toLowerCase())){state.inv="qwe".indexOf(e.key.toLowerCase());render();playPads(chordPads(state.deg,state.inv));}
  else if(e.key===" "&&tag!=="button"){e.preventDefault();playPads(chordPads(state.deg,state.inv));}
});
window.addEventListener("resize",()=>requestAnimationFrame(drawTraces));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(drawTraces));
render();
try{if(localStorage.getItem("push-lab-midi")==="1")midiConnect();}catch(e){}
</script>
