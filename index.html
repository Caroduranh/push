<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push Lab · by Caro Durán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --page:#2e2e2d;--ink:#ededeb;--muted:#a8a8a4;--line:#4d4d4b;--chip:#383837;--sel:#ededeb;--sel-ink:#232322;
  --dev:#0b0b0b;--dev-line:#d6d6d2;--dev-dim:#6b6b68;--pad-off:#151515;--pad-edge:#262626;--pad-scale:#3a3a3a;--pad-ink:#8a8a86;--tonic:#e6e6e2;
  --blue:#2f5bff;--yellow:#ffc83d;--bR:#1f45ff;--bT:#5b82ff;--bF:#a9c1ff;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sig:"Mrs Saint Delafield","Snell Roundhand","Brush Script MT",cursive;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 40px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand h1{font-variation-settings:"wdth" 120;font-weight:800;font-size:clamp(30px,4.4vw,50px);line-height:1;letter-spacing:-.015em;margin:0}
.sig{font-family:var(--sig);font-size:clamp(30px,3.6vw,42px);line-height:1;margin:2px 0 0 4px;display:block;transform:rotate(-3deg);transform-origin:left}
.sub{margin:12px 0 0;color:var(--muted);max-width:56ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.trace-rule{display:block;width:100%;height:18px;margin:18px 0 20px;color:var(--line)}

.tabs{display:inline-flex;gap:0;border:1px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:22px}
.tabs button{border:0;background:transparent;padding:10px 18px;font-weight:700;cursor:pointer;font-variation-settings:"wdth" 110}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,1fr);gap:32px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

/* the Push drawing */
.push{position:relative;background:var(--dev);color:var(--dev-line);border:1.5px solid var(--dev-line);border-radius:18px;padding:clamp(18px,3.4vw,34px);display:flex;flex-direction:column;gap:clamp(10px,1.8vw,16px);outline:1px solid var(--line);outline-offset:4px}
.push::before{content:"";position:absolute;inset:clamp(7px,1.3vw,12px);border:1px solid #2e2e2e;border-radius:12px;pointer-events:none}
.via{position:absolute;width:7px;height:7px;border-radius:50%;border:1.2px solid var(--dev-dim);background:var(--dev)}
.via.tl{top:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px)}.via.tr{top:clamp(4px,1vw,9px);right:clamp(4px,1vw,9px)}
.via.bl{bottom:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px)}.via.br{bottom:clamp(4px,1vw,9px);right:clamp(4px,1vw,9px)}
.screen{position:relative;border-bottom:1px solid #333;min-height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px;font-family:var(--mono);font-size:clamp(11px,1.3vw,13px);letter-spacing:.04em;color:var(--dev-line)}
.screen .hl{color:var(--yellow)}
.silk{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dev-dim);text-transform:uppercase;padding:0 2px}
.gridwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,.9vw,8px)}
.pad{position:relative;aspect-ratio:1;border:1px solid var(--pad-edge);border-radius:clamp(3px,.6vw,6px);background:var(--pad-off);color:var(--pad-ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background-color .12s,transform .08s}
.pad:active{transform:scale(.95)}
.pad.scale{background:var(--pad-scale);color:#cfcfcb;border-color:#444}
.pad.tonic::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--tonic);border-radius:inherit;opacity:.8;pointer-events:none}
.pad .nm{position:absolute;left:4px;bottom:2px;font-family:var(--mono);font-size:clamp(8px,1vw,10px);opacity:.85}
.pad .fn{font-variation-settings:"wdth" 112;font-weight:800;font-size:clamp(12px,2vw,20px)}
.pad.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pad.on.fR{background:var(--bR);border-color:var(--bR);color:#fff}.pad.on.fT{background:var(--bT);border-color:var(--bT);color:#fff}.pad.on.fF{background:var(--bF);border-color:var(--bF);color:#0b1a52}
.pad.sc.p1{background:#a9c1ff;border-color:#a9c1ff;color:#0b1a52}
.pad.sc.p2{background:#5b82ff;border-color:#5b82ff;color:#fff}
.pad.sc.p3{background:#1f45ff;border-color:#1f45ff;color:#fff}
.pad.sc.tj{background:var(--yellow);border-color:var(--yellow);color:#1d1600}
.pad.now{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--dev);transform:scale(1.06);z-index:2}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.notes span{font-family:var(--mono);font-size:13px;padding:4px 8px;border-radius:6px;color:#fff}
.notes .p1{background:#a9c1ff;color:#0b1a52}.notes .p2{background:#5b82ff}.notes .p3{background:#1f45ff}.notes .tj{background:var(--yellow);color:#1d1600}
.notes .now{outline:2px solid var(--ink);outline-offset:1px}
.patline{font-family:var(--mono);font-size:13px;color:var(--muted);margin:10px 0 4px}
.pad.next{background:var(--yellow);border-color:var(--yellow);color:#1d1600}
.pad.common{box-shadow:inset 0 0 0 3px var(--yellow)}
.pad.bass::before{content:"";position:absolute;left:20%;right:20%;bottom:13%;height:3px;border-radius:2px;background:currentColor}
.pad.bass .nm{bottom:auto;top:2px}
.hidenames .pad:not(.on):not(.next) .nm{display:none}
svg.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.traces path{fill:none;stroke:var(--yellow);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.traces circle{fill:var(--dev);stroke:var(--yellow);stroke-width:2}
svg.traces circle.end{fill:var(--yellow)}
.flow svg.traces path{stroke-dasharray:7 9;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}

.under{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.under .setup{font-family:var(--mono);font-size:12px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* panel */
.panel h2{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.block{margin-bottom:22px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys .rowlab{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:4px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:8px 4px;cursor:pointer;font-weight:700;text-align:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.degs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media (max-width:420px){.degs{grid-template-columns:repeat(4,1fr)}}
.deg{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px}
.deg .r{font-size:12px;font-weight:600;opacity:.75}
.invs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets .chip{padding:8px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

.readout{border-top:2px solid var(--ink);padding-top:14px;margin-bottom:18px}
.nameline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.cname{font-variation-settings:"wdth" 122;font-weight:800;font-size:clamp(48px,7vw,72px);line-height:.95;letter-spacing:-.02em}
.rn{font-size:26px;font-weight:600;font-family:Georgia,"Times New Roman",serif}
.fig{display:inline-flex;flex-direction:column;font-size:.5em;line-height:1;vertical-align:.55em;margin-left:1px}
.invname{margin:6px 0 12px;color:var(--muted)}
.nextline{margin:4px 0 0;font-size:15px}
.nextline b{color:var(--ink)}
.nextline .dot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--yellow);margin-right:6px;vertical-align:0}
.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-width:320px}
.stack li{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;font-size:15px}
.stack .pos{color:var(--muted);font-size:13px;font-family:var(--mono)}
.stack .note{border-radius:6px;padding:6px 10px;font-weight:700;display:flex;justify-content:space-between;background:var(--blue);color:#fff}
.stack .note small{font-weight:500;opacity:.85}
.stack .note.fR{background:var(--bR)}.stack .note.fT{background:var(--bT)}.stack .note.fF{background:var(--bF);color:#0b1a52}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--sel);color:var(--sel-ink)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.playing{background:var(--yellow);color:#1d1600}
.num{width:72px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px;cursor:pointer;text-align:center}
.mini[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset;border-color:var(--ink)}
.mini .dev{background:var(--dev);border-radius:6px;padding:4px}
.mini .grid{gap:2px}
.mini .pad{border-radius:2px;cursor:inherit;border:0}
.mini .pad::after,.mini .pad::before{display:none}
.mini span.lab{display:block;margin-top:6px;font-size:13px;font-weight:600}

/* progression timeline */
.timeline{margin-top:22px;border-top:1.5px solid var(--ink);padding-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.card{position:relative;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.card::before{content:"";position:absolute;top:-17px;left:50%;width:1.5px;height:16px;background:var(--ink)}
.card::after{content:"";position:absolute;top:-21px;left:calc(50% - 3.5px);width:8px;height:8px;border-radius:50%;background:var(--page);border:1.5px solid var(--ink)}
.card .cn{font-weight:800;font-size:20px;font-variation-settings:"wdth" 115}
.card .cr{font-family:Georgia,"Times New Roman",serif;font-size:15px}
.card .ci{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.card.cur .ci{color:#dfe6ff}
.card.cur::after{background:var(--blue);border-color:var(--blue)}
.card.nx{box-shadow:0 0 0 2px var(--yellow) inset;border-color:var(--yellow)}
.card.nx::after{background:var(--yellow);border-color:var(--yellow)}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;padding:6px 0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

.keysline{font-size:13px;color:var(--muted);margin-top:22px}
kbd{font-family:var(--mono);font-weight:500;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
footer .sig{font-size:30px;color:var(--ink);transform:rotate(-2deg)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.pad{transition:none}.pad:active{transform:none}.flow svg.traces path{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 data-t="title"></h1>
      <span class="sig" aria-label="by Caro Durán">by Caro Durán</span>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
  </header>
  <svg class="trace-rule" viewBox="0 0 1000 18" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 9 H380 L392 3 H620 L632 9 H1000" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>

  <div class="tabs" role="group">
    <button data-view="scales" data-t="tabScales"></button>
    <button data-view="inv" data-t="tabInv"></button>
    <button data-view="prog" data-t="tabProg"></button>
  </div>

  <div class="main">
    <section>
      <div class="push" id="push">
        <span class="via tl" aria-hidden="true"></span><span class="via tr" aria-hidden="true"></span><span class="via bl" aria-hidden="true"></span><span class="via br" aria-hidden="true"></span>
        <div class="screen" id="screen" aria-live="polite"></div>
        <div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div><svg class="traces" id="traces"></svg></div>
        <div class="silk"><span>chromatic · 4ths · C</span><span>by caro durán</span></div>
      </div>
      <div class="under">
        <span class="setup" data-t="setup"></span>
        <span class="setup" id="patinfo"></span>
        <label class="chk"><input type="checkbox" id="names"> <span data-t="names"></span></label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="timeline" id="timeline" hidden></div>
      <p class="hint" id="tlhint" hidden></p>
    </section>

    <section class="panel">
      <div class="block">
        <h2 data-t="key"></h2>
        <div class="keys" id="keys"></div>
      </div>

      <div id="scPanel" hidden>
        <div class="readout" id="sreadout"></div>
        <div class="actions">
          <button class="btn" id="splay"></button>
          <label class="chk"><span>BPM</span><input class="num" type="number" id="sbpm" min="40" max="220" step="1"></label>
          <label class="chk"><input type="checkbox" id="sdown"> <span data-t="updown"></span></label>
        </div>
        <p class="hint" data-t="exam"></p>
      </div>

      <div id="invPanel">
        <div class="block"><h2 data-t="chord"></h2><div class="degs" id="degs"></div></div>
        <div class="block"><h2 data-t="inversion"></h2><div class="invs" id="invs"></div></div>
        <div class="readout" id="readout"></div>
        <div class="actions">
          <button class="btn" id="play" data-t="play"></button>
          <button class="btn alt" id="playAll" data-t="playAll"></button>
        </div>
        <h2 data-t="compare"></h2>
        <div class="minis" id="minis"></div>
      </div>

      <div id="progPanel" hidden>
        <div class="block"><h2 data-t="presets"></h2><div class="presets" id="presets"></div></div>
        <div class="block">
          <h2 data-t="build"></h2>
          <div class="degs" id="pdegs"></div>
          <div class="row" style="margin-top:8px">
            <button class="btn alt" id="undo" data-t="undo"></button>
            <button class="btn alt" id="clear" data-t="clear"></button>
          </div>
        </div>
        <div class="readout" id="preadout"></div>
        <div class="block">
          <div class="row" style="margin-bottom:12px">
            <label class="chk"><input type="checkbox" id="vl"> <span data-t="vl"></span></label>
          </div>
          <div class="actions">
            <button class="btn" id="pplay"></button>
            <label class="chk"><span>BPM</span><input class="num" type="number" id="bpm" min="40" max="220" step="1"></label>
            <label class="chk"><input type="checkbox" id="loop"> <span data-t="loop"></span></label>
          </div>
          <p class="hint" data-t="countin"></p>
        </div>
      </div>
      <p class="keysline" id="keysline"></p>
    </section>
  </div>

  <footer>
    <span data-t="foot"></span>
    <span class="sig">Caro Durán</span>
  </footer>
</div>

 "C":{root:0,mode:"maj",sp:["C","D","E","F","G","A","B"],flat:false},
 "G":{root:7,mode:"maj",sp:["G","A","B","C","D","E","F♯"],flat:false},
 "D":{root:2,mode:"maj",sp:["D","E","F♯","G","A","B","C♯"],flat:false},
 "A":{root:9,mode:"maj",sp:["A","B","C♯","D","E","F♯","G♯"],flat:false},
 "E":{root:4,mode:"maj",sp:["E","F♯","G♯","A","B","C♯","D♯"],flat:false},
 "B":{root:11,mode:"maj",sp:["B","C♯","D♯","E","F♯","G♯","A♯"],flat:false},
 "F♯":{root:6,mode:"maj",sp:["F♯","G♯","A♯","B","C♯","D♯","E♯"],flat:false},
 "D♭":{root:1,mode:"maj",sp:["D♭","E♭","F","G♭","A♭","B♭","C"],flat:true},
 "A♭":{root:8,mode:"maj",sp:["A♭","B♭","C","D♭","E♭","F","G"],flat:true},
 "E♭":{root:3,mode:"maj",sp:["E♭","F","G","A♭","B♭","C","D"],flat:true},
 "B♭":{root:10,mode:"maj",sp:["B♭","C","D","E♭","F","G","A"],flat:true},
 "F":{root:5,mode:"maj",sp:["F","G","A","B♭","C","D","E"],flat:true},
 "Am":{root:9,mode:"min",sp:["A","B","C","D","E","F","G"],flat:false},
 "Em":{root:4,mode:"min",sp:["E","F♯","G","A","B","C","D"],flat:false},
 "Bm":{root:11,mode:"min",sp:["B","C♯","D","E","F♯","G","A"],flat:false},
 "F♯m":{root:6,mode:"min",sp:["F♯","G♯","A","B","C♯","D","E"],flat:false},
 "C♯m":{root:1,mode:"min",sp:["C♯","D♯","E","F♯","G♯","A","B"],flat:false},
 "G♯m":{root:8,mode:"min",sp:["G♯","A♯","B","C♯","D♯","E","F♯"],flat:false},
 "D♯m":{root:3,mode:"min",sp:["D♯","E♯","F♯","G♯","A♯","B","C♯"],flat:false},
 "B♭m":{root:10,mode:"min",sp:["B♭","C","D♭","E♭","F","G♭","A♭"],flat:true},
 "Fm":{root:5,mode:"min",sp:["F","G","A♭","B♭","C","D♭","E♭"],flat:true},
 "Cm":{root:0,mode:"min",sp:["C","D","E♭","F","G","A♭","B♭"],flat:true},
 "Gm":{root:7,mode:"min",sp:["G","A","B♭","C","D","E♭","F"],flat:true},
 "Dm":{root:2,mode:"min",sp:["D","E","F","G","A","B♭","C"],flat:true}
};
const MAJ_ORDER=["C","G","D","A","E","B","F♯","D♭","A♭","E♭","B♭","F"],MIN_ORDER=["Am","Em","Bm","F♯m","C♯m","G♯m","D♯m","B♭m","Fm","Cm","Gm","Dm"];
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10];
const SHARP=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],FLAT=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const ROM=["I","II","III","IV","V","VI","VII"];
const FCLS={R:"R","3":"T","5":"F"};

const t=()=>T[state.lang]||T.en;
const K=()=>KEYS[state.key];
const S=()=>K().mode==="maj"?MAJ:MIN;

function pcName(pc){const k=K(),s=S();for(let i=0;i<7;i++)if((k.root+s[i])%12===pc)return k.sp[i];return (k.flat?FLAT:SHARP)[pc];}
function inScale(p){return MAJ.includes(((p%12)+12)%12);}
function padPitch(r,c){return 48+r*5+c;}
function chordInfo(deg){
  const k=K(),s=S();
  const r=s[deg],th=s[(deg+2)%7]+(deg+2>=7?12:0),fi=s[(deg+4)%7]+(deg+4>=7?12:0);
  const q=(th-r)===4?"maj":((fi-r)===6?"dim":"min");
  let rn=ROM[deg];if(q!=="maj")rn=rn.toLowerCase();if(q==="dim")rn+="°";
  const base=48+k.root;
  return {q,rn,name:k.sp[deg]+(q==="maj"?"":q==="min"?"m":"°"),
    notes:[{p:base+r,f:"R"},{p:base+th,f:"T"},{p:base+fi,f:"F"}]};
}
function voiced(deg,inv){
  const n=chordInfo(deg).notes.map(x=>({...x}));
  if(inv>=1)n[0].p+=12;if(inv>=2)n[1].p+=12;
  return n.sort((a,b)=>a.p-b.p);
}
function findPads(notes){
  const opts=notes.map(n=>{const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(padPitch(r,c)===n.p)a.push({r,c});return a;});
  if(opts.some(o=>!o.length))return [];
  let best=null,bc=Infinity;
  for(const a of opts[0])for(const b of opts[1])for(const d of opts[2]){
    const rs=[a.r,b.r,d.r],cs=[a.c,b.c,d.c];
    const cost=(Math.max(...rs)-Math.min(...rs)+Math.max(...cs)-Math.min(...cs))*100+(rs[0]+rs[1]+rs[2])*3+(cs[0]+cs[1]+cs[2]);
    if(cost<bc){bc=cost;best=[a,b,d];}
  }
  return best.map((pos,i)=>({...pos,...notes[i],bass:i===0}));
}
// Scale patterns (offsets row,col from the pattern's starting tonic), degrees 1..8
const PAT=[
 [[0,0],[0,2],[0,4],[1,0],[1,2],[1,4],[2,1],[2,2]],
 [[0,0],[0,2],[1,-1],[1,0],[1,2],[2,-1],[2,1],[2,2]],
 [[0,0],[1,-3],[1,-1],[1,0],[2,-3],[2,-1],[3,-4],[3,-3]]
];
const PAT_MIN=PAT.map(x=>x.map(y=>y.slice()));PAT_MIN[2][6]=[2,0];
const onGrid=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
let layoutCache={};
function scaleLayout(){
  const key=state.key;if(layoutCache[key])return layoutCache[key];
  const k=K(),s=S();let best=null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(padPitch(r,c)%12!==k.root)continue;
    for(let st=0;st<3;st++){
      let cur=[r,c],pat=st,segs=[];
      while(pat<3){
        const cells=(k.mode==="min"?PAT_MIN:PAT)[pat].map(o=>[cur[0]+o[0],cur[1]+o[1]]);
        if(!cells.every(x=>onGrid(x[0],x[1])))break;
        segs.push({pat,cells});cur=cells[7];pat++;
      }
      if(!segs.length)continue;
      const score=segs.length*1000+(st===0&&c===0?500:0)-r*10-st;
      if(!best||score>best.score)best={score,r,c,segs};
    }
  }
  const P0=padPitch(best.r,best.c),map={};
  best.segs.forEach((seg,o)=>{
    seg.cells.forEach((cell,i)=>{
      const target=P0+12*o+s[i%7]+(i===7?12:0);
      let pos=null;
      if(padPitch(cell[0],cell[1])===target)pos=cell;
      else{let bd=1e9;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(padPitch(r,c)===target){const d=Math.hypot(r-cell[0],c-cell[1]);if(d<bd){bd=d;pos=[r,c];}}}
      if(pos&&map[target]===undefined)map[target]={r:pos[0],c:pos[1],pat:seg.pat+1,deg:i%7};
    });
  });
  const notes=Object.keys(map).map(Number).sort((a,b)=>a-b).map(p=>({p,...map[p],tonic:(p-P0)%12===0}));
  return layoutCache[key]={P0,map,notes,seq:best.segs.map(x=>x.pat+1)};
}
function chordCands(deg,inv){
  const L=scaleLayout(),s=S();
  const rel=[{o:s[deg],f:"R"},{o:s[(deg+2)%7]+(deg+2>=7?12:0),f:"T"},{o:s[(deg+4)%7]+(deg+4>=7?12:0),f:"F"}];
  if(inv>=1)rel[0].o+=12;if(inv>=2)rel[1].o+=12;
  const out=[];
  for(const sh of [0,-12,12,-24,24]){
    const ps=rel.map(x=>L.P0+x.o+sh);
    if(ps.every(p=>L.map[p]))out.push(rel.map((x,i)=>({p:ps[i],f:x.f,r:L.map[ps[i]].r,c:L.map[ps[i]].c})).sort((a,b)=>a.p-b.p).map((x,i)=>({...x,bass:i===0})));
  }
  return out;
}
function chordPads(deg,inv){
  const L=scaleLayout(),s=S();
  const rel=[{o:s[deg],f:"R"},{o:s[(deg+2)%7]+(deg+2>=7?12:0),f:"T"},{o:s[(deg+4)%7]+(deg+4>=7?12:0),f:"F"}];
  if(inv>=1)rel[0].o+=12;if(inv>=2)rel[1].o+=12;
  for(const sh of [0,-12,12,-24,24]){
    const ps=rel.map(x=>L.P0+x.o+sh);
    if(ps.every(p=>L.map[p])){
      return rel.map((x,i)=>({p:ps[i],f:x.f,r:L.map[ps[i]].r,c:L.map[ps[i]].c})).sort((a,b)=>a.p-b.p).map((x,i)=>({...x,bass:i===0}));
    }
  }
  return findPads(voiced(deg,inv));
}

const PRESETS={maj:[[0,3,4,0],[0,4,5,3],[1,4,0],[0,5,3,4]],min:[[0,3,4,0],[0,5,2,6],[0,3,6,2],[0,5,6,0]]};
const DEF={key:"C",deg:0,inv:0,names:true,lang:"en",view:"scales",sdown:true,prog:[0,3,4,0],over:{},vl:true,step:0,bpm:120,loop:true};
function load(){try{const v=localStorage.getItem("push-lab2");return v?JSON.parse(v):{}}catch(e){return {}}}
function save(){try{const {playing,...rest}=state;localStorage.setItem("push-lab2",JSON.stringify(rest))}catch(e){}}
let state=Object.assign({},DEF,load(),{playing:false});
if(!KEYS[state.key])state.key="C";
if(!Array.isArray(state.prog))state.prog=[0,3,4,0];
if(typeof state.over!=="object"||!state.over)state.over={};

function fig(inv){return inv===0?"":inv===1?`<span class="fig"><span>6</span></span>`:`<span class="fig"><span>6</span><span>4</span></span>`;}
function figTxt(inv){return inv===0?"":inv===1?"6":"64";}
function keyLabel(){const k=K();return k.sp[0]+(k.mode==="maj"?" maj":" min");}

function voicings(){
  const out=[];let prev=null;
  state.prog.forEach((d,i)=>{
    let inv=0;
    if(state.over[i]!==undefined)inv=state.over[i];
    const cost=c=>c.reduce((s,n,j)=>s+Math.abs(n.p-prev[j].p)+0.3*Math.hypot(n.r-prev[j].r,n.c-prev[j].c),0);
    let pads=null;
    if(state.over[i]===undefined&&state.vl&&prev){let bc=Infinity;for(let k=0;k<3;k++)for(const c of chordCands(d,k)){const v=cost(c);if(v<bc){bc=v;inv=k;pads=c;}}}
    else if(prev){let bc=Infinity;for(const c of chordCands(d,inv)){const v=cost(c);if(v<bc){bc=v;pads=c;}}}
    if(!pads)pads=chordPads(d,inv);
    out.push({d,inv,pads});prev=pads;
  });
  return out;
}
function nextIndex(V){if(!V.length)return -1;const n=state.step+1;if(n<V.length)return n;return state.loop&&V.length>1?0:-1;}

function padsHTML(marks,mini){
  let h="";
  for(let r=7;r>=0;r--)for(let c=0;c<8;c++){
    const p=padPitch(r,c),pc=p%12,m=marks[r*8+c];
    let cls="pad";
    if(m)cls+=" "+m.cls+(m.bass?" bass":"");
    else{if(MAJ.includes(pc))cls+=" scale";if(pc===0)cls+=" tonic";}
    if(mini){h+=`<div class="${cls}"></div>`;continue;}
    const nm=pcName(pc);
    h+=`<button class="${cls}" data-p="${p}" data-rc="${r},${c}" aria-label="${nm}${m&&m.aria?", "+m.aria:""}"><span class="nm">${nm}</span>${m&&m.label?`<span class="fn">${m.label}</span>`:""}</button>`;
  }
  return h;
}
function marksFor(pads,cls,shade){const L=t(),m={};pads.forEach(x=>m[x.r*8+x.c]={cls:cls+(shade?" f"+x.f:""),label:L.fnPad[x.f],bass:x.bass,aria:L.fn[x.f]});return m;}

let traceData=[];
function drawTraces(){
  const svg=document.getElementById("traces"),wrap=document.getElementById("gridwrap");
  let h="";
  traceData.forEach(([a,b],ti)=>{
    const ea=wrap.querySelector(`[data-rc="${a.r},${a.c}"]`),eb=wrap.querySelector(`[data-rc="${b.r},${b.c}"]`);
    if(!ea||!eb)return;
    const x1=ea.offsetLeft+ea.offsetWidth/2,y1=ea.offsetTop+ea.offsetHeight/2,x2=eb.offsetLeft+eb.offsetWidth/2,y2=eb.offsetTop+eb.offsetHeight/2;
    const ha=ea.offsetHeight/2,hb=eb.offsetHeight/2;let d,sy,ey;
    if(Math.abs(y1-y2)<2){sy=y1-ha;ey=y2-hb;const yo=sy-Math.max(5,ha*0.22);d=`M${x1} ${sy} V${yo} H${x2} V${ey}`;}
    else{const down=y2>y1;sy=down?y1+ha:y1-ha;ey=down?y2-hb:y2+hb;const ym=(sy+ey)/2+(ti-(traceData.length-1)/2)*5;d=`M${x1} ${sy} V${ym} H${x2} V${ey}`;}
    h+=`<path d="${d}"/><circle cx="${x1}" cy="${sy}" r="3.5"/><circle class="end" cx="${x2}" cy="${ey}" r="3.5"/>`;
  });
  svg.innerHTML=h;
}

function render(){
  const L=t();
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L[el.dataset.t];if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang));
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===state.view));
  document.getElementById("names").checked=state.names;
  document.getElementById("patinfo").textContent=L.patterns+" "+scaleLayout().seq.join(" → ");
  document.getElementById("gridwrap").classList.toggle("hidenames",!state.names);
  const prog=state.view==="prog",sc=state.view==="scales";
  document.getElementById("scPanel").hidden=!sc;
  document.getElementById("invPanel").hidden=prog||sc;
  document.getElementById("progPanel").hidden=!prog;
  document.getElementById("timeline").hidden=!prog;
  document.getElementById("tlhint").hidden=!prog;
  document.getElementById("keysline").innerHTML=prog?L.keysProg:sc?L.keysSc:L.keysInv;

  let kh=`<span class="rowlab">${L.major}</span>`+MAJ_ORDER.map(k=>`<button class="chip" data-key="${k}" aria-pressed="${k===state.key}">${k}</button>`).join("");
  kh+=`<span class="rowlab">${L.minor}</span>`+MIN_ORDER.map(k=>`<button class="chip" data-key="${k}" aria-pressed="${k===state.key}">${k}</button>`).join("");
  document.getElementById("keys").innerHTML=kh;

  if(prog)renderProg(L);else if(sc)renderScales(L);else renderInv(L);
  save();
  requestAnimationFrame(drawTraces);
}

let scaleNow=-1,scTimers=[],scPlaying=false;
function scaleSeq(){const n=scaleLayout().notes;return state.sdown?n.concat(n.slice(0,-1).reverse()):n;}
function renderScales(L){
  const Ly=scaleLayout(),k=K(),marks={};
  const cur=scaleNow>=0?scaleSeq()[scaleNow]:null;
  Ly.notes.forEach(n=>{marks[n.r*8+n.c]={cls:"sc "+(n.tonic?"tj":"p"+n.pat)+(cur&&cur.p===n.p?" now":""),label:String(n.deg+1),aria:"degree "+(n.deg+1)};});
  document.getElementById("grid").innerHTML=padsHTML(marks,false);
  traceData=[];document.getElementById("push").classList.remove("flow");
  const kname=k.sp[0]+" "+L.scale[k.mode];
  document.getElementById("screen").innerHTML=`<span>${keyLabel()}</span><span>${L.lgP} ${Ly.seq.join(" → ")}</span>`;
  const chip=n=>`<span class="${n.tonic?"tj":"p"+n.pat}${cur&&cur.p===n.p?" now":""}">${pcName(n.p%12)}</span>`;
  const groups=Ly.seq.map((pt,i)=>{const own=Ly.notes.filter(n=>n.pat===pt);if(i===0)return own;const prev=Ly.notes.filter(n=>n.pat===Ly.seq[i-1]);return [prev[prev.length-1]].concat(own);});
  document.getElementById("sreadout").innerHTML=`<div class="nameline"><span class="cname" style="font-size:clamp(40px,6vw,60px)">${kname}</span></div>
    <p class="invname">${L.lgP} ${Ly.seq.join(" → ")} · ${Ly.seq.length} ${L.octaves}. ${L.patDesc}</p>`+
    groups.map((g,i)=>`<p class="patline">${L.lgP} ${Ly.seq[i]}</p><div class="notes">${g.map(chip).join("")}</div>`).join("");
  const bp=document.getElementById("sbpm");if(document.activeElement!==bp)bp.value=state.bpm;
  document.getElementById("sdown").checked=state.sdown;
  const b=document.getElementById("splay");b.textContent=scPlaying?L.stopP:L.playS;b.classList.toggle("playing",scPlaying);
  document.getElementById("legend").innerHTML=Ly.seq.map(pt=>`<span><i class="sw" style="background:${["","#a9c1ff","#5b82ff","#1f45ff"][pt]}"></i>${L.lgP} ${pt}</span>`).join("")+`<span><i class="sw" style="background:var(--yellow)"></i>${L.lgTj}</span>`;
}
function stopScale(){scTimers.forEach(clearTimeout);scTimers=[];scPlaying=false;scaleNow=-1;render();}
function playScale(){
  if(scPlaying){stopScale();return;}
  const a=ac();if(!a)return;
  const seq=scaleSeq(),step=60/state.bpm/2;
  scPlaying=true;
  const t0=a.currentTime+0.05;
  seq.forEach((n,i)=>{tone(n.p,t0+i*step,step*0.95);scTimers.push(setTimeout(()=>{scaleNow=i;render();},(0.05+i*step)*1000));});
  scTimers.push(setTimeout(()=>{scPlaying=false;scaleNow=-1;render();},(0.05+seq.length*step+0.2)*1000));
  render();
}
function renderInv(L){
  document.getElementById("degs").innerHTML=[0,1,2,3,4,5,6].map(d=>{const c=chordInfo(d);return `<button class="chip deg" data-deg="${d}" aria-pressed="${d===state.deg}"><span>${c.name}</span><span class="r">${c.rn}</span></button>`;}).join("");
  document.getElementById("invs").innerHTML=[0,1,2].map(i=>`<button class="chip" data-inv="${i}" aria-pressed="${i===state.inv}">${L.inv[i]}</button>`).join("");
  const lit=chordPads(state.deg,state.inv);
  document.getElementById("grid").innerHTML=padsHTML(marksFor(lit,"on",true),false);
  traceData=[];
  document.getElementById("push").classList.remove("flow");
  const ci=chordInfo(state.deg);
  document.getElementById("screen").innerHTML=`<span>${keyLabel()}</span><span>${ci.name} ${ci.rn}${figTxt(state.inv)}</span>`;
  const rows=lit.map((n,i)=>({n,i})).reverse().map(({n,i})=>`<li><span class="pos">${L.pos[i]}</span><span class="note f${n.f}">${pcName(n.p%12)} <small>${L.fn[n.f]}</small></span></li>`).join("");
  document.getElementById("readout").innerHTML=`<div class="nameline"><span class="cname">${ci.name}</span><span class="rn">${ci.rn}${fig(state.inv)}</span></div><p class="invname">${L.inv[state.inv]}. ${L.explain[state.inv]}</p><ol class="stack">${rows}</ol>`;
  document.getElementById("minis").innerHTML=[0,1,2].map(i=>`<button class="mini" data-inv="${i}" aria-pressed="${i===state.inv}" aria-label="${L.inv[i]}"><div class="dev"><div class="grid">${padsHTML(marksFor(chordPads(state.deg,i),"on",true),true)}</div></div><span class="lab">${L.invShort[i]}</span></button>`).join("");
  document.getElementById("legend").innerHTML=`<span><i class="sw" style="background:var(--bR)"></i>${L.fn.R}</span><span><i class="sw" style="background:var(--bT)"></i>${L.fn.T}</span><span><i class="sw" style="background:var(--bF)"></i>${L.fn.F}</span><span>▁ ${L.lgBass}</span><span>▢ ${L.lgTonic}</span>`;
}

function renderProg(L){
  const mode=K().mode;
  const cur=JSON.stringify(state.prog);
  document.getElementById("presets").innerHTML=PRESETS[mode].map((p,i)=>`<button class="chip" data-preset="${i}" aria-pressed="${JSON.stringify(p)===cur}">${p.map(d=>chordInfo(d).rn).join("–")}</button>`).join("");
  document.getElementById("pdegs").innerHTML=[0,1,2,3,4,5,6].map(d=>{const c=chordInfo(d);return `<button class="chip deg" data-add="${d}"><span>${c.name}</span><span class="r">${c.rn}</span></button>`;}).join("");
  document.getElementById("vl").checked=state.vl;
  document.getElementById("loop").checked=state.loop;
  const bpmEl=document.getElementById("bpm");if(document.activeElement!==bpmEl)bpmEl.value=state.bpm;
  const pp=document.getElementById("pplay");pp.textContent=state.playing?L.stopP:L.playP;pp.classList.toggle("playing",state.playing);

  const V=voicings();
  if(state.step>=V.length)state.step=Math.max(0,V.length-1);
  const ni=nextIndex(V);
  const tl=document.getElementById("timeline");
  tl.innerHTML=V.length?V.map((v,i)=>{const c=chordInfo(v.d);return `<button class="card${i===state.step?" cur":""}${i===ni&&i!==state.step?" nx":""}" data-card="${i}"><span class="cn">${c.name}</span><span class="cr">${c.rn}${fig(v.inv)}</span><span class="ci">${L.invShort[v.inv]}</span></button>`;}).join(""):`<p class="empty">${L.empty}</p>`;
  document.getElementById("tlhint").textContent=V.length?L.tapCard:"";

  let marks={};traceData=[];
  const push=document.getElementById("push");
  push.classList.toggle("flow",state.playing);
  if(V.length){
    const a=V[state.step];
    marks=marksFor(a.pads,"on");
    if(ni>=0&&ni!==state.step){
      const b=V[ni];
      b.pads.forEach(x=>{const k=x.r*8+x.c;if(marks[k])marks[k].cls="on common";else marks[k]={cls:"next",label:L.fnPad[x.f],aria:L.lgNext};});
      a.pads.forEach((x,i)=>{const y=b.pads[i];if(x.r!==y.r||x.c!==y.c)traceData.push([x,y]);});
    }
    const ca=chordInfo(a.d);
    const nb=ni>=0&&ni!==state.step?chordInfo(V[ni].d):null;
    document.getElementById("screen").innerHTML=`<span>${keyLabel()}</span><span>${ca.name} ${ca.rn}${figTxt(a.inv)}${nb?` <span class="hl">→ ${nb.name} ${nb.rn}${figTxt(V[ni].inv)}</span>`:""}</span>`;
    document.getElementById("preadout").innerHTML=`<div class="nameline"><span class="cname">${ca.name}</span><span class="rn">${ca.rn}${fig(a.inv)}</span></div><p class="invname">${L.inv[a.inv]}. ${L.explain[a.inv]}</p>${nb?`<p class="nextline"><span class="dot"></span>${L.next}: <b>${nb.name}</b> <span class="rn" style="font-size:17px">${nb.rn}${fig(V[ni].inv)}</span> · ${L.inv[V[ni].inv]}</p>`:""}`;
  }else{
    document.getElementById("screen").innerHTML=`<span>${keyLabel()}</span><span>—</span>`;
    document.getElementById("preadout").innerHTML=`<p class="invname">${L.empty}</p>`;
  }
  document.getElementById("grid").innerHTML=padsHTML(marks,false);
  document.getElementById("legend").innerHTML=`<span><i class="sw" style="background:var(--blue)"></i>${L.lgSound}</span><span><i class="sw" style="background:var(--yellow)"></i>${L.lgNext}</span><span><i class="sw" style="background:var(--blue);box-shadow:inset 0 0 0 3px var(--yellow)"></i>${L.lgCommon}</span><span>▁ ${L.lgBass}</span>`;
}

/* audio */
let ctx=null;
function ac(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();}if(ctx.state==="suspended")ctx.resume();return ctx;}
function tone(m,t0,dur){const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
  o.type="triangle";o.frequency.value=440*Math.pow(2,(m-69)/12);f.type="lowpass";f.frequency.value=2400;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.15,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
  o.connect(f);f.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.05);}
function click(t0,acc){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=acc?1760:1180;
  g.gain.setValueAtTime(acc?0.06:0.035,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.04);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+0.05);}
function playPads(pads,dur){const a=ac();if(!a)return;const t0=a.currentTime+0.02;pads.forEach(n=>tone(n.p,t0,dur||0.95));}
let busy=false;
function playAll(){if(busy)return;busy=true;const btn=document.getElementById("playAll");
  [0,1,2].forEach((i,k)=>setTimeout(()=>{state.inv=i;render();playPads(chordPads(state.deg,i));if(k===2)setTimeout(()=>{busy=false;},1000);},k*1000));}

let timer=null,beat=0;
function startPlay(){if(!state.prog.length)return;if(!ac())return;state.playing=true;beat=-4;tick();timer=setInterval(tick,60000/state.bpm);render();}
function stopPlay(){clearInterval(timer);timer=null;state.playing=false;render();}
function tick(){
  const V=voicings(),a=ac(),t0=a.currentTime+0.01,spb=60/state.bpm;
  if(beat<0){click(t0,beat===-4);beat++;return;}
  const idx=Math.floor(beat/4),b=beat%4;
  if(idx>=V.length){if(state.loop){beat=0;return tick();}stopPlay();return;}
  click(t0,b===0);
  if(b===0){state.step=idx;render();V[idx].pads.forEach(n=>tone(n.p,t0,spb*4*0.92));}
  beat++;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.lang){state.lang=d.lang;render();}
  else if(d.view){if(state.playing)stopPlay();if(scPlaying)stopScale();state.view=d.view;render();}
  else if(d.key){if(scPlaying){scTimers.forEach(clearTimeout);scTimers=[];scPlaying=false;scaleNow=-1;}state.key=d.key;state.over={};render();}
  else if(d.deg!==undefined){state.deg=+d.deg;render();playPads(chordPads(state.deg,state.inv));}
  else if(d.inv!==undefined){state.inv=+d.inv;render();playPads(chordPads(state.deg,state.inv));}
  else if(d.preset!==undefined){state.prog=PRESETS[K().mode][+d.preset].slice();state.over={};state.step=0;render();}
  else if(d.add!==undefined){if(state.prog.length<8){state.prog.push(+d.add);state.step=state.prog.length-1;render();playPads(voicings()[state.step].pads);}}
  else if(d.card!==undefined){const i=+d.card;const V=voicings();
    if(i===state.step){state.over[i]=(V[i].inv+1)%3;}else state.step=i;
    render();if(!state.playing)playPads(voicings()[state.step].pads);}
  else if(d.p){const a=ac();if(a)tone(+d.p,a.currentTime+0.01,0.8);}
  else if(b.id==="play")playPads(chordPads(state.deg,state.inv));
  else if(b.id==="playAll")playAll();
  else if(b.id==="undo"){if(state.prog.length){delete state.over[state.prog.length-1];state.prog.pop();render();}}
  else if(b.id==="clear"){if(state.playing)stopPlay();state.prog=[];state.over={};state.step=0;render();}
  else if(b.id==="pplay"){state.playing?stopPlay():startPlay();}
  else if(b.id==="splay")playScale();
});
document.getElementById("sdown").addEventListener("change",e=>{state.sdown=e.target.checked;render();});
document.getElementById("sbpm").addEventListener("change",e=>{let v=Math.round(+e.target.value)||120;v=Math.min(220,Math.max(40,v));state.bpm=v;e.target.value=v;save();});
document.getElementById("names").addEventListener("change",e=>{state.names=e.target.checked;render();});
document.getElementById("vl").addEventListener("change",e=>{state.vl=e.target.checked;state.over={};render();});
document.getElementById("loop").addEventListener("change",e=>{state.loop=e.target.checked;render();});
document.getElementById("bpm").addEventListener("change",e=>{let v=Math.round(+e.target.value)||120;v=Math.min(220,Math.max(40,v));state.bpm=v;e.target.value=v;if(state.playing){clearInterval(timer);timer=setInterval(tick,60000/state.bpm);}save();});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input")return;
  if(state.view==="scales"){if(e.key===" "&&tag!=="button"){e.preventDefault();playScale();}return;}
  if(state.view==="prog"){
    const n=state.prog.length;
    if(e.key==="ArrowRight"&&n){state.step=(state.step+1)%n;render();if(!state.playing)playPads(voicings()[state.step].pads);}
    else if(e.key==="ArrowLeft"&&n){state.step=(state.step-1+n)%n;render();if(!state.playing)playPads(voicings()[state.step].pads);}
    else if(e.key===" "&&tag!=="button"){e.preventDefault();state.playing?stopPlay():startPlay();}
    return;
  }
  if(/^[1-7]$/.test(e.key)){state.deg=+e.key-1;render();playPads(chordPads(state.deg,state.inv));}
  else if(e.key.length===1&&"qwe".includes(e.key.toLowerCase())){state.inv="qwe".indexOf(e.key.toLowerCase());render();playPads(chordPads(state.deg,state.inv));}
  else if(e.key===" "&&tag!=="button"){e.preventDefault();playPads(chordPads(state.deg,state.inv));}
});
window.addEventListener("resize",()=>requestAnimationFrame(drawTraces));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(drawTraces));
render();
</script>
</body>
