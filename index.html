<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push triad inversions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dfe2dd; --ink:#1b211e; --muted:#58605b; --line:#bcc1ba; --chip:#eef0ec; --chip-ink:#1b211e;
  --sel:#1b211e; --sel-ink:#f1f3ef;
  --body:#303437; --body-edge:#24282a; --pad-off:#3b4043; --pad-off-ink:#7d837f;
  --pad-scale:#9a9f9b; --pad-scale-ink:#1c2022; --tonic:#e8ebe6;
  --c-root:#2f6bff; --c-third:#f2b01e; --c-fifth:#ff5577;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#171a19; --ink:#e6e9e5; --muted:#9aa29d; --line:#363b38; --chip:#222624; --chip-ink:#e6e9e5;
    --sel:#e6e9e5; --sel-ink:#171a19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#171a19; --ink:#e6e9e5; --muted:#9aa29d; --line:#363b38; --chip:#222624; --chip-ink:#e6e9e5;
  --sel:#e6e9e5; --sel-ink:#171a19; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
h1{font-variation-settings:"wdth" 118;font-weight:800;font-size:clamp(28px,4.2vw,46px);line-height:1.02;letter-spacing:-.01em;margin:0 0 8px}
.sub{margin:0;color:var(--muted);max-width:52ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}

.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,1fr);gap:32px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:1fr}}

/* the device */
.device{background:linear-gradient(180deg,var(--body),var(--body-edge));border-radius:20px;padding:clamp(12px,2.4vw,22px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px -18px rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,.9vw,8px)}
.pad{position:relative;aspect-ratio:1;border:0;border-radius:clamp(4px,.8vw,7px);background:var(--pad-off);color:var(--pad-off-ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:background-color .12s,transform .08s}
.pad:active{transform:scale(.96)}
.pad.scale{background:var(--pad-scale);color:var(--pad-scale-ink)}
.pad.tonic::after{content:"";position:absolute;inset:3px;border:2px solid var(--tonic);border-radius:inherit;opacity:.85;pointer-events:none}
.pad.scale.tonic::after{border-color:#2a2f31;opacity:.6}
.pad .nm{position:absolute;left:5px;bottom:3px;font-size:clamp(8px,1.1vw,11px);font-weight:600;opacity:.85}
.pad .fn{font-variation-settings:"wdth" 110;font-weight:800;font-size:clamp(13px,2.2vw,22px)}
.pad.R{background:var(--c-root);color:#fff}
.pad.T{background:var(--c-third);color:#1c1a12}
.pad.F{background:var(--c-fifth);color:#fff}
.pad.R::after,.pad.T::after,.pad.F::after{display:none}
.pad.bass::before{content:"";position:absolute;left:18%;right:18%;bottom:14%;height:3px;border-radius:2px;background:currentColor;opacity:.9}
.pad.bass .nm{bottom:auto;top:3px}
.hidenames .pad:not(.R):not(.T):not(.F) .nm{display:none}
.setup{font-weight:600}
.modebar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--chip);padding:6px 11px;cursor:pointer;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

/* panel */
.panel h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;letter-spacing:.01em}
.block{margin-bottom:22px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:center}
.keys .rowlab{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:4px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:8px;padding:8px 4px;cursor:pointer;font-weight:700;text-align:center}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.degs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media (max-width:420px){.degs{grid-template-columns:repeat(4,1fr)}}
.deg{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px}
.deg .r{font-size:12px;font-weight:600;opacity:.75}
.invs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.readout{border-top:2px solid var(--ink);padding-top:14px;margin-bottom:18px}
.nameline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.cname{font-variation-settings:"wdth" 122;font-weight:800;font-size:clamp(48px,7vw,72px);line-height:.95;letter-spacing:-.02em}
.rn{font-size:26px;font-weight:600;font-family:Georgia,"Times New Roman",serif}
.fig{display:inline-flex;flex-direction:column;font-size:.5em;line-height:1;vertical-align:.55em;margin-left:1px}
.invname{margin:6px 0 12px;color:var(--muted)}
.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-width:320px}
.stack li{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;font-size:15px}
.stack .pos{color:var(--muted);font-size:13px}
.stack .note{border-radius:6px;padding:6px 10px;font-weight:700;display:flex;justify-content:space-between}
.stack .note small{font-weight:500;opacity:.85}
.note.R{background:var(--c-root);color:#fff}.note.T{background:var(--c-third);color:#1c1a12}.note.F{background:var(--c-fifth);color:#fff}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--sel);color:var(--sel-ink)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn:disabled{opacity:.5;cursor:default}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px;cursor:pointer;text-align:center}
.mini[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset;border-color:var(--ink)}
.mini .dev{background:var(--body);border-radius:6px;padding:4px}
.mini .grid{gap:2px}
.mini .pad{border-radius:2px;cursor:inherit}
.mini .pad::after,.mini .pad::before{display:none}
.mini span.lab{display:block;margin-top:6px;font-size:13px;font-weight:600}
.keysline{font-size:13px;color:var(--muted);margin-top:22px}
kbd{font-family:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
@media (prefers-reduced-motion: reduce){.pad{transition:none}.pad:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="es">ES</button>
    </div>
  </header>

  <div class="main">
    <section>
      <div class="device"><div class="grid" id="grid"></div></div>
      <div class="modebar">
        <span class="setup" data-t="setup"></span>
        <span class="setup" id="patinfo"></span>
        <label class="chk"><input type="checkbox" id="names"> <span data-t="names"></span></label>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel">
      <div class="block">
        <h2 data-t="key"></h2>
        <div class="keys" id="keys"></div>
      </div>
      <div class="block">
        <h2 data-t="chord"></h2>
        <div class="degs" id="degs"></div>
      </div>
      <div class="block">
        <h2 data-t="inversion"></h2>
        <div class="invs" id="invs"></div>
      </div>
      <div class="readout" id="readout"></div>
      <div class="actions">
        <button class="btn" id="play" data-t="play"></button>
        <button class="btn alt" id="playAll" data-t="playAll"></button>
      </div>
      <h2 data-t="compare"></h2>
      <div class="minis" id="minis"></div>
      <p class="keysline" id="keysline"></p>
    </section>
  </div>
</div>

<script>
const T={
 en:{title:"Triad inversions on Push",sub:"Pick a key, a chord and an inversion. The lit pads are what you play. Tap any pad to hear it.",
  key:"Key",chord:"Chord",inversion:"Inversion",compare:"The same chord, three ways",
  inv:["Root position","1st inversion","2nd inversion"],invShort:["Root","1st","2nd"],
  explain:["The root is in the bass.","The third is in the bass.","The fifth is in the bass."],
  play:"Play chord",playAll:"Play all three",chromatic:"Chromatic",inkey:"In Key",
  fixed:"Fixed: pads keep their notes when the key changes",names:"Note names",major:"Major",minor:"Minor",
  fn:{R:"root",T:"third",F:"fifth"},fnPad:{R:"R",T:"3",F:"5"},pos:["bass","middle","top"],
  lgBass:"bar marks the bass note",lgTonic:"outline marks C",setup:"Push set to: C, Chromatic, 4ths layout",patterns:"Scale patterns:",
  keysline:"Keyboard: <kbd>1</kbd>–<kbd>7</kbd> chord, <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> inversion, <kbd>Space</kbd> play."},
 es:{title:"Inversiones de tríadas en Push",sub:"Elige una tonalidad, un acorde y una inversión. Los pads encendidos son los que tocas. Toca cualquier pad para escucharlo.",
  key:"Tonalidad",chord:"Acorde",inversion:"Inversión",compare:"El mismo acorde, de tres formas",
  inv:["Estado fundamental","1ª inversión","2ª inversión"],invShort:["Fund.","1ª","2ª"],
  explain:["La fundamental está en el bajo.","La tercera está en el bajo.","La quinta está en el bajo."],
  play:"Tocar acorde",playAll:"Tocar las tres",chromatic:"Cromático",inkey:"In Key",
  fixed:"Fixed: los pads no cambian de nota al cambiar de tonalidad",names:"Nombres de notas",major:"Mayor",minor:"Menor",
  fn:{R:"fundamental",T:"tercera",F:"quinta"},fnPad:{R:"F",T:"3",F:"5"},pos:["bajo","medio","arriba"],
  lgBass:"la barra marca la nota del bajo",lgTonic:"el contorno marca C",setup:"Push en: C, Cromático, layout 4ths",patterns:"Patterns de escala:",
  keysline:"Teclado: <kbd>1</kbd>–<kbd>7</kbd> acorde, <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> inversión, <kbd>Espacio</kbd> tocar."}
};
const KEYS={
 "C":{root:0,mode:"maj",sp:["C","D","E","F","G","A","B"],flat:false},
 "G":{root:7,mode:"maj",sp:["G","A","B","C","D","E","F♯"],flat:false},
 "D":{root:2,mode:"maj",sp:["D","E","F♯","G","A","B","C♯"],flat:false},
 "A":{root:9,mode:"maj",sp:["A","B","C♯","D","E","F♯","G♯"],flat:false},
 "E":{root:4,mode:"maj",sp:["E","F♯","G♯","A","B","C♯","D♯"],flat:false},
 "B":{root:11,mode:"maj",sp:["B","C♯","D♯","E","F♯","G♯","A♯"],flat:false},
 "F♯":{root:6,mode:"maj",sp:["F♯","G♯","A♯","B","C♯","D♯","E♯"],flat:false},
 "D♭":{root:1,mode:"maj",sp:["D♭","E♭","F","G♭","A♭","B♭","C"],flat:true},
 "A♭":{root:8,mode:"maj",sp:["A♭","B♭","C","D♭","E♭","F","G"],flat:true},
 "E♭":{root:3,mode:"maj",sp:["E♭","F","G","A♭","B♭","C","D"],flat:true},
 "B♭":{root:10,mode:"maj",sp:["B♭","C","D","E♭","F","G","A"],flat:true},
 "F":{root:5,mode:"maj",sp:["F","G","A","B♭","C","D","E"],flat:true},
 "Am":{root:9,mode:"min",sp:["A","B","C","D","E","F","G"],flat:false},
 "Em":{root:4,mode:"min",sp:["E","F♯","G","A","B","C","D"],flat:false},
 "Bm":{root:11,mode:"min",sp:["B","C♯","D","E","F♯","G","A"],flat:false},
 "F♯m":{root:6,mode:"min",sp:["F♯","G♯","A","B","C♯","D","E"],flat:false},
 "C♯m":{root:1,mode:"min",sp:["C♯","D♯","E","F♯","G♯","A","B"],flat:false},
 "G♯m":{root:8,mode:"min",sp:["G♯","A♯","B","C♯","D♯","E","F♯"],flat:false},
 "D♯m":{root:3,mode:"min",sp:["D♯","E♯","F♯","G♯","A♯","B","C♯"],flat:false},
 "B♭m":{root:10,mode:"min",sp:["B♭","C","D♭","E♭","F","G♭","A♭"],flat:true},
 "Fm":{root:5,mode:"min",sp:["F","G","A♭","B♭","C","D♭","E♭"],flat:true},
 "Cm":{root:0,mode:"min",sp:["C","D","E♭","F","G","A♭","B♭"],flat:true},
 "Gm":{root:7,mode:"min",sp:["G","A","B♭","C","D","E♭","F"],flat:true},
 "Dm":{root:2,mode:"min",sp:["D","E","F","G","A","B♭","C"],flat:true}
};
const MAJ_ORDER=["C","G","D","A","E","B","F♯","D♭","A♭","E♭","B♭","F"],MIN_ORDER=["Am","Em","Bm","F♯m","C♯m","G♯m","D♯m","B♭m","Fm","Cm","Gm","Dm"];
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10];
const SHARP=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],FLAT=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const ROM=["I","II","III","IV","V","VI","VII"];
const FCLS={R:"R","3":"T","5":"F"};

function load(){try{const v=localStorage.getItem("push-inv5");return v?JSON.parse(v):{}}catch(e){return {}}}
function save(){try{localStorage.setItem("push-inv5",JSON.stringify(state))}catch(e){}}
let state=Object.assign({key:"C",deg:0,inv:0,layout:"chromatic",fixed:true,names:true,lang:"en"},load());
if(!KEYS[state.key])state.key="C";
const t=()=>T[state.lang]||T.en;
const K=()=>KEYS[state.key];
const S=()=>K().mode==="maj"?MAJ:MIN;

function pcName(pc){const k=K(),s=S();for(let i=0;i<7;i++)if((k.root+s[i])%12===pc)return k.sp[i];return (k.flat?FLAT:SHARP)[pc];}
function inScale(p){return MAJ.includes(((p%12)+12)%12);}
function padPitch(r,c){return 48+r*5+c;}
function chordInfo(deg){
  const k=K(),s=S();
  const r=s[deg],th=s[(deg+2)%7]+(deg+2>=7?12:0),fi=s[(deg+4)%7]+(deg+4>=7?12:0);
  const q=(th-r)===4?"maj":((fi-r)===6?"dim":"min");
  let rn=ROM[deg];if(q!=="maj")rn=rn.toLowerCase();if(q==="dim")rn+="°";
  const base=48+k.root;
  return {q,rn,name:k.sp[deg]+(q==="maj"?"":q==="min"?"m":"°"),
    notes:[{p:base+r,f:"R"},{p:base+th,f:"T"},{p:base+fi,f:"F"}]};
}
function voiced(deg,inv){
  const n=chordInfo(deg).notes.map(x=>({...x}));
  if(inv>=1)n[0].p+=12;if(inv>=2)n[1].p+=12;
  return n.sort((a,b)=>a.p-b.p);
}
function findPads(notes){
  const opts=notes.map(n=>{const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(padPitch(r,c)===n.p)a.push({r,c});return a;});
  if(opts.some(o=>!o.length))return [];
  let best=null,bc=Infinity;
  for(const a of opts[0])for(const b of opts[1])for(const d of opts[2]){
    const rs=[a.r,b.r,d.r],cs=[a.c,b.c,d.c];
    const cost=(Math.max(...rs)-Math.min(...rs)+Math.max(...cs)-Math.min(...cs))*100+(rs[0]+rs[1]+rs[2])*3+(cs[0]+cs[1]+cs[2]);
    if(cost<bc){bc=cost;best=[a,b,d];}
  }
  return best.map((pos,i)=>({...pos,...notes[i],bass:i===0}));
}
// Scale patterns (offsets row,col from the pattern's starting tonic), degrees 1..8
const PAT=[
 [[0,0],[0,2],[0,4],[1,0],[1,2],[1,4],[2,1],[2,2]],
 [[0,0],[0,2],[1,-1],[1,0],[1,2],[2,-1],[2,1],[2,2]],
 [[0,0],[1,-3],[1,-1],[1,0],[2,-3],[2,-1],[3,-4],[3,-3]]
];
const onGrid=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
let layoutCache={};
function scaleLayout(){
  const key=state.key;if(layoutCache[key])return layoutCache[key];
  const k=K(),s=S();let best=null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(padPitch(r,c)%12!==k.root)continue;
    for(let st=0;st<3;st++){
      let cur=[r,c],pat=st,segs=[];
      while(pat<3){
        const cells=PAT[pat].map(o=>[cur[0]+o[0],cur[1]+o[1]]);
        if(!cells.every(x=>onGrid(x[0],x[1])))break;
        segs.push({pat,cells});cur=cells[7];pat++;
      }
      if(!segs.length)continue;
      const score=segs.length*1000-r*10-st;
      if(!best||score>best.score)best={score,r,c,segs};
    }
  }
  const P0=padPitch(best.r,best.c),map={};
  best.segs.forEach((seg,o)=>{
    seg.cells.forEach((cell,i)=>{
      const target=P0+12*o+s[i%7]+(i===7?12:0);
      let pos=null;
      if(padPitch(cell[0],cell[1])===target)pos=cell;
      else{let bd=1e9;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(padPitch(r,c)===target){const d=Math.hypot(r-cell[0],c-cell[1]);if(d<bd){bd=d;pos=[r,c];}}}
      if(pos&&map[target]===undefined)map[target]={r:pos[0],c:pos[1]};
    });
  });
  return layoutCache[key]={P0,map,seq:best.segs.map(x=>x.pat+1)};
}
function chordPads(deg,inv){
  const L=scaleLayout(),s=S();
  const rel=[{o:s[deg],f:"R"},{o:s[(deg+2)%7]+(deg+2>=7?12:0),f:"T"},{o:s[(deg+4)%7]+(deg+4>=7?12:0),f:"F"}];
  if(inv>=1)rel[0].o+=12;if(inv>=2)rel[1].o+=12;
  for(const sh of [0,-12,12,-24,24]){
    const ps=rel.map(x=>L.P0+x.o+sh);
    if(ps.every(p=>L.map[p])){
      return rel.map((x,i)=>({p:ps[i],f:x.f,r:L.map[ps[i]].r,c:L.map[ps[i]].c})).sort((a,b)=>a.p-b.p).map((x,i)=>({...x,bass:i===0}));
    }
  }
  return findPads(voiced(deg,inv));
}
function gridHTML(lit,mini){
  const map={};lit.forEach(x=>map[x.r*8+x.c]=x);
  const root=0;let h="";
  for(let r=7;r>=0;r--)for(let c=0;c<8;c++){
    const p=padPitch(r,c),L=map[r*8+c],pc=p%12;
    let cls="pad";
    if(L){cls+=" "+L.f+(L.bass?" bass":"");}
    else{if(inScale(p))cls+=" scale";if(pc===root)cls+=" tonic";}
    const nm=pcName(pc);
    if(mini){h+=`<div class="${cls}"></div>`;continue;}
    const label=L?`${nm}, ${t().fn[L.f]}${L.bass?", "+t().pos[0]:""}`:nm;
    h+=`<button class="${cls}" data-p="${p}" aria-label="${label}"><span class="nm">${nm}</span>${L?`<span class="fn">${t().fnPad[L.f]}</span>`:""}</button>`;
  }
  return h;
}
function fig(inv){return inv===0?"":inv===1?`<span class="fig"><span>6</span></span>`:`<span class="fig"><span>6</span><span>4</span></span>`;}

function render(){
  const L=t();
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L[el.dataset.t];if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang));
  document.getElementById("names").checked=state.names;
  document.getElementById("keysline").innerHTML=L.keysline;
  document.getElementById("patinfo").textContent=L.patterns+" "+scaleLayout().seq.join(" → ");

  // keys
  let kh=`<span class="rowlab">${L.major}</span>`+MAJ_ORDER.map(k=>`<button class="chip" data-key="${k}" aria-pressed="${k===state.key}">${k}</button>`).join("");
  kh+=`<span class="rowlab">${L.minor}</span>`+MIN_ORDER.map(k=>`<button class="chip" data-key="${k}" aria-pressed="${k===state.key}">${k}</button>`).join("");
  document.getElementById("keys").innerHTML=kh;

  // degrees
  document.getElementById("degs").innerHTML=[0,1,2,3,4,5,6].map(d=>{const c=chordInfo(d);
    return `<button class="chip deg" data-deg="${d}" aria-pressed="${d===state.deg}"><span>${c.name}</span><span class="r">${c.rn}</span></button>`;}).join("");

  // inversions
  document.getElementById("invs").innerHTML=[0,1,2].map(i=>`<button class="chip" data-inv="${i}" aria-pressed="${i===state.inv}">${L.inv[i]}</button>`).join("");

  // grid
  const lit=chordPads(state.deg,state.inv),notes=lit;
  const g=document.getElementById("grid");g.innerHTML=gridHTML(lit,false);
  g.parentElement.classList.toggle("hidenames",!state.names);

  // readout
  const ci=chordInfo(state.deg);
  const rows=notes.map((n,i)=>({n,i})).reverse().map(({n,i})=>`<li><span class="pos">${L.pos[i]}</span><span class="note ${n.f}">${pcName(n.p%12)} <small>${L.fn[n.f]}</small></span></li>`).join("");
  document.getElementById("readout").innerHTML=
    `<div class="nameline"><span class="cname">${ci.name}</span><span class="rn">${ci.rn}${fig(state.inv)}</span></div>
     <p class="invname">${L.inv[state.inv]}. ${L.explain[state.inv]}</p>
     <ol class="stack">${rows}</ol>`;

  // minis
  document.getElementById("minis").innerHTML=[0,1,2].map(i=>`<button class="mini" data-inv="${i}" aria-pressed="${i===state.inv}" aria-label="${L.inv[i]}"><div class="dev"><div class="grid">${gridHTML(chordPads(state.deg,i),true)}</div></div><span class="lab">${L.invShort[i]}</span></button>`).join("");

  // legend
  document.getElementById("legend").innerHTML=
    `<span><i class="sw" style="background:var(--c-root)"></i>${L.fn.R}</span>
     <span><i class="sw" style="background:var(--c-third)"></i>${L.fn.T}</span>
     <span><i class="sw" style="background:var(--c-fifth)"></i>${L.fn.F}</span>
     <span>▁ ${L.lgBass}</span><span>▢ ${L.lgTonic}</span>`;
  save();
}

// audio
let ctx=null;
function ac(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();}if(ctx.state==="suspended")ctx.resume();return ctx;}
function tone(m,t0,dur){const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
  o.type="triangle";o.frequency.value=440*Math.pow(2,(m-69)/12);f.type="lowpass";f.frequency.value=2400;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.16,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
  o.connect(f);f.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.05);}
function playChord(inv){const a=ac();if(!a)return;const t0=a.currentTime+0.02;chordPads(state.deg,inv).forEach(n=>tone(n.p,t0,0.95));}
let busy=false;
function playAll(){if(busy)return;busy=true;const btn=document.getElementById("playAll");btn.disabled=true;
  [0,1,2].forEach((i,k)=>setTimeout(()=>{state.inv=i;render();playChord(i);if(k===2)setTimeout(()=>{busy=false;btn.disabled=false;},1000);},k*1000));}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){state.lang=b.dataset.lang;render();}
  else if(b.dataset.key){state.key=b.dataset.key;render();}
  else if(b.dataset.deg!==undefined){state.deg=+b.dataset.deg;render();playChord(state.inv);}
  else if(b.dataset.inv!==undefined){state.inv=+b.dataset.inv;render();playChord(state.inv);}
  else if(b.dataset.p){const a=ac();if(a)tone(+b.dataset.p,a.currentTime+0.01,0.8);}
  else if(b.id==="play")playChord(state.inv);
  else if(b.id==="playAll")playAll();
});
document.getElementById("names").addEventListener("change",e=>{state.names=e.target.checked;render();});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input")return;
  if(/^[1-7]$/.test(e.key)){state.deg=+e.key-1;render();playChord(state.inv);}
  else if("qwe".includes(e.key.toLowerCase())&&e.key.length===1){state.inv="qwe".indexOf(e.key.toLowerCase());render();playChord(state.inv);}
  else if(e.key===" "&&tag!=="button"){e.preventDefault();playChord(state.inv);}
});
render();
</script>
</body>
</html>
